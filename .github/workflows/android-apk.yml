name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# 说明：
#   本工作流用「非 Gradle 直接导出 .apk」在 CI 中稳定出包。
#   - 导出模板版本与 Godot 一致（4.7.1-stable）；JDK 17 + Android SDK。
#   - 包名 ASCII：com.ants.example.empire。
#   - 当前只产出 Debug APK（用自建 debug keystore 签名，非敏感）。
#   - Release 签名（Keystore 走 Secrets）待你在仓库 Secrets 配好后再加回，避免 secrets 上下文触发校验问题。

env:
  GODOT_VERSION: "4.7.1"
  GODOT_TAG: "4.7.1-stable"
  ANDROID_API: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm -f tools.zip
          yes | latest/bin/sdkmanager --licenses || true
          latest/bin/sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Download Godot + export templates (4.7.1)
        run: |
          set -euo pipefail
          BIN="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          TPL="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p godot_bin
          wget -q -O godot_bin/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/${BIN}.zip"
          ( cd godot_bin && unzip -q godot.zip )
          chmod +x "godot_bin/${BIN}"
          echo "godot_bin/${BIN}" > godot_path.txt
          # 导出模板（目录名用「点号」版本名，如 4.7.1.stable）
          wget -q -O tpl.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/${TPL}"
          mkdir -p tpl_extract
          unzip -q tpl.zip -d tpl_extract
          SRC="$(dirname "$(find tpl_extract -name android_release.apk -print -quit)")"
          [ -n "$SRC" ] || SRC="$(dirname "$(find tpl_extract -name android_debug.apk -print -quit)")"
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          cp -r "$SRC"/. "$DEST"/
          echo "=== 已安装导出模板 -> $DEST ==="
          ls -1 "$DEST" | head
          test -f "$DEST/android_release.apk" -o -f "$DEST/android_debug.apk" && echo "android templates OK" || { echo "android templates MISSING"; exit 1; }

      - name: Import project
        run: |
          set -euo pipefail
          export ANDROID_HOME="$ANDROID_HOME"
          GODOT="$(cat godot_path.txt)"
          "$GODOT" --headless --path . --import || true

      - name: Export Debug APK
        run: |
          set -euo pipefail
          export ANDROID_HOME="$ANDROID_HOME"
          GODOT="$(cat godot_path.txt)"
          mkdir -p build
          "$GODOT" --headless --path . --export-debug "Android" "build/EmpireAnts-debug.apk"
          ls -la build

      - name: Sign & align Debug APK
        run: |
          set -euo pipefail
          export ANDROID_HOME="$ANDROID_HOME"
          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Ants, C=US"
          if ! "$APKSIGNER" verify "build/EmpireAnts-debug.apk" 2>/dev/null; then
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/debug.keystore" --ks-pass pass:android --key-pass pass:android \
              --out "build/EmpireAnts-debug-unsigned.apk" "build/EmpireAnts-debug.apk"
            "$ZIPALIGN" -f 4 "build/EmpireAnts-debug-unsigned.apk" "build/EmpireAnts-debug.apk"
          fi
          "$APKSIGNER" verify --print-certs "build/EmpireAnts-debug.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmpireAnts-debug
          path: build/EmpireAnts-debug.apk
