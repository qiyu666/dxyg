name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync web assets + icons into native shell
        run: |
          set -e
          node build-standalone.js
          node make-icon.js
          A=android/app/src/main/assets
          mkdir -p "$A/maps"
          cp ant-kingdom.html "$A/"
          cp map_editor.html "$A/"
          cp maps/level-*.js "$A/maps/"
          M=android/app/src/main/res
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$M/$d"
            cp assets/icon-512.png "$M/$d/ic_launcher.png"
          done

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (commandline tools)
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076758_latest.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install Gradle 8.7
        run: |
          set -e
          curl -sSLo g.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -qo g.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: cd android && gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ant-kingdom
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          apk="ant-kingdom.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release create apk --target main --title "ant-kingdom" --notes "Android APK" -F "$apk" --clobber 2>/dev/null || \
            gh release upload apk "$apk" --clobber
