<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb3b3" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <g filter="url(#glow)" fill="none" stroke="#ff3b3b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 大腹部（后） -->
    <ellipse cx="128" cy="176" rx="34" ry="44" fill="#2a0a0a" stroke="#ff5b5b"/>
    <path d="M100 176 q28 -18 56 0" stroke="#ff8a8a" stroke-width="3"/>
    <path d="M96 196 q32 -16 64 0" stroke="#ff8a8a" stroke-width="3"/>
    <!-- 胸部（中） -->
    <ellipse cx="128" cy="128" rx="24" ry="24" fill="#3a0f0f" stroke="#ff6b6b"/>
    <!-- 头部（前）带颚 -->
    <circle cx="128" cy="86" r="20" fill="#3a0f0f" stroke="#ff6b6b"/>
    <path d="M118 100 q-8 12 -2 16" stroke="#ff8a8a" stroke-width="4"/>
    <path d="M138 100 q8 12 2 16" stroke="#ff8a8a" stroke-width="4"/>
    <!-- 触角 -->
    <path d="M118 72 q-16 -18 -26 -20" stroke="#ff8a8a" stroke-width="3.5"/>
    <path d="M138 72 q16 -18 26 -20" stroke="#ff8a8a" stroke-width="3.5"/>
    <!-- 眼 -->
    <circle cx="120" cy="82" r="3.5" fill="#ffdddd" stroke="none"/>
    <circle cx="136" cy="82" r="3.5" fill="#ffdddd" stroke="none"/>
    <!-- 腿（六条） -->
    <path d="M112 132 q-26 6 -34 22" stroke="#ff6b6b" stroke-width="3.5"/>
    <path d="M112 142 q-24 12 -30 30" stroke="#ff6b6b" stroke-width="3.5"/>
    <path d="M114 152 q-18 16 -20 34" stroke="#ff6b6b" stroke-width="3.5"/>
    <path d="M144 132 q26 6 34 22" stroke="#ff6b6b" stroke-width="3.5"/>
    <path d="M144 142 q24 12 30 30" stroke="#ff6b6b" stroke-width="3.5"/>
    <path d="M142 152 q18 16 20 34" stroke="#ff6b6b" stroke-width="3.5"/>
  </g>
  <!-- 翅膀（半透明，后） -->
  <g fill="url(#w)" stroke="#ffd0d0" stroke-width="1.5" opacity="0.85">
    <path d="M118 120 q-40 -26 -54 -6 q26 24 54 18 z"/>
    <path d="M138 120 q40 -26 54 -6 q-26 24 -54 18 z"/>
  </g>
</svg>
