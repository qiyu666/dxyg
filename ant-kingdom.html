  function showLevels() {
    let html = '<h2>选择关卡</h2><div class="list">';
    for (let i = 0; i < LEVELS.length; i++) {
      const lv = LEVELS[i];
      const locked = i > 0 && !home.cleared[i - 1];
      if (i === 0 || lv.chapter !== LEVELS[i - 1].chapter) html += `<div class="chap-hd">${lv.chapter}${lv.surface ? ' · 含地表' : ''}</div>`;
      html += `<div class="row-item ${locked ? 'locked' : ''}" data-lv="${i}">
        <div class="dot" style="background:${locked ? '#333' : '#c9821a'}"></div>
        <div class="r-info"><div class="r-name">${lv.name} · ${lv.sub}</div><div class="r-sub">${home.cleared[i] ? '已通关' : lv.desc}</div></div>
        <div class="r-tag">${locked ? '🔒' : (home.cleared[i] ? '✅' : '▶')}</div>
      </div>`;
    }
    html += '</div><button class="ghost-btn" id="ov-back">返回蚁丘</button>';
    showOverlay(html);
    overlayCard.querySelectorAll('.row-item').forEach(el => {
      if (el.classList.contains('locked')) return;
      el.onclick = () => startLevel(parseInt(el.dataset.lv, 10));
    });
    document.getElementById('ov-back').onclick = () => { hideOverlay(); enterHome(home); };
  }

  // =========================================================
  //  关卡
  // =========================================================
  function createLevel(idx) {
    const lv = LEVELS[idx];
    const st = {
      idx, lv, def: lv, radius: LEVEL_RADIUS, tiles: {},
      food: 35, larva: 0, larvaTimer: 0,
      queenHp: 500, queenMax: 500,
      ants: [], enemies: [], foods: [], corpses: [], webs: [], buried: {},
      squads: [], selSquad: 0, buildMode: null,
      builtSoldier: 0, builtWorker: 0, harvested: 0,
      spawnAcc: 0, over: false, win: false, time: 0,
      raidTimer: 120, raidCount: 0, raidStolen: false, pointsSpent: 0, foodTimer: (lv.foodRate || 12),
      uiTab: 'build', viewLayer: 'under', pheromone: false,
    };
    makeQueenTiles(st.tiles);
    for (let i = 0; i < 5; i++) st.squads.push({ assigned: new Set(), marker: null, allowAttack: true, allowCarry: true });
    // 初始 7 只工蚁，默认分配到队伍 I
    const qp = h2p(0, 0);
    for (let i = 0; i < 7; i++) {
      st.ants.push(makeAnt('worker', qp.x + (Math.random() - 0.5) * 30, qp.y + (Math.random() - 0.5) * 30, 0));
    }
    if (lv.surface) for (let i = 0; i < 4; i++) st.ants.push(makeAnt('soldier', qp.x + (Math.random() - 0.5) * 24, qp.y + (Math.random() - 0.5) * 24, 0));
    // 敌人不再开局就出在面上；埋进泥土，玩家挖掘才钻出（照 地下蚁国）
    if (lv.kind === 'expand') spawnLevel2(st);   // 扩建关：地面铺食物（便于造孵化室）
    plantBuried(st);                              // 把静态敌人 + 泥土食物埋进土里
    if (lv.surface) spawnSurface(st);              // ① 第二章：地表清地（食物 + 昆虫 + 竖井）
    return st;
  }

  function storageCapLevel(st) {
    let cap = 70;
    for (const k in st.tiles) { const t = st.tiles[k]; if (t.type === 'storage') cap += storageCapOf(t.level); }
    return cap;
  }
  function levelFoodCap(st) { return storageCapLevel(st); }

  function initStats() {
    // 从家读取进化加成
    const e = home ? home.evolutions : { hp: 0, atk: 0, speed: 0, carry: 0, bigSoldier: false };
    return {
      hpMul: 1 + 0.2 * e.hp,
      atkMul: 1 + 0.15 * e.atk,
      spdMul: 1 + 0.08 * e.speed,
      carryCap: 1 + e.carry,
      big: !!e.bigSoldier,
    };
  }

  function makeAnt(kind, x, y, squad) {
    const ev = initStats();
    const base = kind === 'soldier'
      ? { hp: 70, atk: 10, speed: 52 }
      : { hp: 25, atk: 3, speed: 42 };
    const bigMul = (kind === 'soldier' && ev.big) ? 1.4 : 1;
    return {
      kind, x, y, angle: -Math.PI / 2, squad,
      hp: base.hp * ev.hpMul * bigMul, maxhp: base.hp * ev.hpMul * bigMul,
      atk: base.atk * ev.atkMul * bigMul,
      speed: base.speed * ev.spdMul,
      carry: 0, carryCap: ev.carryCap,
      cd: 0, phase: Math.random() * 6, state: 'idle',
      homeQ: 0, homeR: 0,
    };
  }

  function spawnLevel1Enemies(st) {
    const kinds = ['mealworm', 'mealworm', 'mealworm', 'sowbug', 'sowbug', 'beetle', 'beetle', 'adultBeetle'];
    for (const k of kinds) {
      const [q, r] = randRing(5, 7);
      const p = h2p(q, r);
      st.enemies.push(makeEnemy(k, p.x, p.y));
    }
  }
  function spawnLevel2(st) {
    // 蜘蛛/蛛丝蜘蛛不再开局就在外面；埋进土里（plantBuried），玩家挖到才钻出
    // 蛛丝洞穴 = 地表食物巢（大量食物，供扩建），不自动钻出蛛丝蜘蛛
    for (let i = 0; i < 3; i++) {
      const [q, r] = randRing(4, 7); const p = h2p(q, r);
      st.webs.push({ x: p.x, y: p.y, q, r, triggered: true });
      for (let j = 0; j < 8; j++) st.foods.push({ x: p.x + (Math.random() - 0.5) * 55, y: p.y + (Math.random() - 0.5) * 55, amount: 40 });
    }
    // 地面约 500 食物（便于扩建）
    for (let i = 0; i < 25; i++) { const [q, r] = randRing(2, 7); const p = h2p(q, r); st.foods.push({ x: p.x + (Math.random() - 0.5) * 30, y: p.y + (Math.random() - 0.5) * 30, amount: 20 }); }
  }
  function randRing(a, b) {
    for (let i = 0; i < 40; i++) {
      const q = Math.floor(Math.random() * (b * 2 + 1)) - b;
      const r = Math.floor(Math.random() * (b * 2 + 1)) - b;
      const d = hdist(q, r, 0, 0);
      if (d >= a && d <= b) return [q, r];
    }
    return [b, 0];
  }

  function makeEnemy(kind, x, y) {
    const defs = {
      mealworm: { hp: 22, atk: 2, speed: 26, size: 0.9 },
      sowbug: { hp: 48, atk: 4, speed: 30, size: 1.0 },
      beetle: { hp: 75, atk: 8, speed: 30, size: 1.35 },
      adultBeetle: { hp: 170, atk: 14, speed: 26, size: 1.9 },
      spider: { hp: 95, atk: 12, speed: 62, size: 1.4 },
      webSpider: { hp: 90, atk: 30, speed: 60, size: 1.2 },
      enemyAnt: { hp: 42, atk: 6, speed: 56, size: 1.0 },
    };
    const d = defs[kind];
    return { kind, x, y, angle: 0, hp: d.hp, maxhp: d.hp, atk: d.atk, speed: d.speed, size: d.size, cd: 0, phase: Math.random() * 6, dead: false, steal: 0, zone: 'under' };
  }

  // ① 地表层：地下巢穴(原点) ↔ 地表清地(SURF_C)靠竖井连通
  function zoneOf(x, y) { return Math.hypot(x - SURF_C.x, y - SURF_C.y) < SURF_R + 40 ? 'surface' : 'under'; }

  function spawnSurface(st) {
    for (let i = 0; i < 10; i++) {
      const ang = Math.random() * 6.28, rad = 60 + Math.random() * (SURF_R - 100);
      const x = SURF_C.x + Math.cos(ang) * rad, y = SURF_C.y + Math.sin(ang) * rad * 0.7;
      st.foods.push({ x, y, amount: 40, surface: true });
    }
    const bugs = st.lv.surfBugs || ['beetle'];
    for (const k of bugs) {
      const e = makeEnemy(k, SURF_C.x + (Math.random() - 0.5) * SURF_R, SURF_C.y + (Math.random() - 0.5) * SURF_R * 0.7);
      e.zone = 'surface'; st.enemies.push(e);
    }
    st.shafts = { under: { x: SHAFT_U.x, y: SHAFT_U.y }, surface: { x: SHAFT_S.x, y: SHAFT_S.y } };
  }

  function checkSurfaceWin() {
    if (!S || S.over || S.win) return;
    const lv = S.lv;
    if ((S.harvested || 0) < lv.forageGoal) return;
    if (lv.clearBugs && surfaceBugsLeft() > 0) return;
    winLevel();
  }

  function applyLayerView() {
    if (!S) return;
    view.cx = 270;
    if (!S._s0) S._s0 = view.s;                 // 记录 fitMap 基准缩放
    if (S.viewLayer === 'surface') {
      view.s = S._s0 * 1.5;                      // 地表放大看清实体
      view.cy = LH * 0.5 - SURF_C.y * view.s * TILT;
    } else {
      view.s = S._s0;                            // 地下：2D 平面取景
      view.cy = 470;
    }
    view.baseS = view.s; view.ox = 0; view.oy = 0;
    view.maxPan = Math.round(view.baseS * (S.radius * HEX * SQ3));
  }

  // 跨区移动：不同区先走到本区竖井口，到口后瞬移到对侧口
  function routeMove(a, tx, ty, spd, dt) {
    if (!S.shafts) { moveTo(a, tx, ty, spd, dt); return; }
    const za = zoneOf(a.x, a.y), zb = zoneOf(tx, ty);
    if (za === zb) { moveTo(a, tx, ty, spd, dt); return; }
    const g = za === 'under' ? S.shafts.under : S.shafts.surface;
    if (Math.hypot(g.x - a.x, g.y - a.y) > 10) moveTo(a, g.x, g.y, spd, dt);
    else { const o = za === 'under' ? S.shafts.surface : S.shafts.under; a.x = o.x; a.y = o.y; moveTo(a, tx, ty, spd, dt); }
  }

  function drawSurfaceGround() {
    // 地表清地（暗苔绿、可看得清；边缘渐黑 + 2.5D 压扁椭圆）
    const g = ctx.createRadialGradient(SURF_C.x, SURF_C.y, 30, SURF_C.x, SURF_C.y, SURF_R + 60);
    g.addColorStop(0, 'rgba(64,86,40,.72)'); g.addColorStop(0.6, 'rgba(44,60,28,.4)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(SURF_C.x, SURF_C.y, SURF_R + 60, (SURF_R + 60) * TILT, 0, 0, 7); ctx.fill();
    // 地面纹理（斑点，去饱和）
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    for (let i = 0; i < 40; i++) { const a = i * 1.7, r = (i * 37) % SURF_R; const x = SURF_C.x + Math.cos(a) * r, y = SURF_C.y + Math.sin(a) * r * 0.7; ctx.beginPath(); ctx.ellipse(x, y, 7, 4, a, 0, 7); ctx.fill(); }
    // 竖井口（地表侧）
    if (S.shafts) {
      const s2 = S.shafts.surface;
      ctx.fillStyle = '#0d0804'; ctx.beginPath(); ctx.ellipse(s2.x, s2.y, 18, 12, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(210,180,110,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(s2.x, s2.y, 18, 12, 0, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(230,210,175,.95)'; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center'; ctx.fillText('↕ 竖井', s2.x, s2.y - 16);
    }
    // 标题
    ctx.fillStyle = 'rgba(210,195,160,.75)'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('— 地表（采集 / 清剿）—', SURF_C.x, SURF_C.y - (SURF_R + 40));
  }

  function startLevel(idx) {
    Sfx.resume();
    S = createLevel(idx);
    screen = 'level'; buildMode = null; selectedHomeTile = null;
    hideOverlay(); fitMap(LEVEL_RADIUS); applyLayerView();
    showHUD(true); showBottom(true); showZoom(true);
    hud.larva.parentElement.style.display = '';
    refreshLevelHUD(); refreshBottom();
    toast(S.lv.sub + '：' + S.lv.desc, 2400);
    setTimeout(() => { if (screen === 'level') toast('底部选建筑 → 点巢穴旁空地建孵化室', 2400); }, 1200);
    setTimeout(() => { if (screen === 'level') toast('选中队伍 → 点孵化室分配 → 点/拖动地图放信息素点（只保留最新）', 3200); }, 3600);
  }

  function threatsLeft() { let n = S.enemies.length; for (const k in S.buried) if (S.buried[k] && S.buried[k].enemy) n++; return n; }
  function surfaceBugsLeft() { return S.enemies.filter(e => e.zone === 'surface').length; }
  function levelObjectiveText() {
    const lv = S.lv;
    if (lv.kind === 'clear') return '威胁 ' + threatsLeft() + '（挖开泥土会钻出）';
    if (lv.kind === 'expand') return '兵蚁孵化室 ' + S.builtSoldier + '/' + lv.needS + ' · 工蚁 ' + S.builtWorker + '/' + lv.needW;
    if (lv.kind === 'surface') return '采集食物 ' + Math.floor(S.harvested || 0) + '/' + lv.forageGoal + (lv.clearBugs ? ' · 地表昆虫 ' + surfaceBugsLeft() : '');
    return '';
  }
  function checkLevelWin() {
    if (!S || S.over) return;
    const lv = S.lv;
    if (lv.kind === 'expand' && S.builtSoldier >= lv.needS && S.builtWorker >= lv.needW) winLevel();
    else if (lv.kind === 'surface') checkSurfaceWin();
  }

  function levelPop() {
    let w = 0, s = 0, wMax = 0, sMax = 0;
    for (const a of S.ants) { if (a.hp <= 0) continue; if (a.kind === 'worker') w++; else s++; }
    for (const k in S.tiles) { const t = S.tiles[k]; if (t.type === 'worker') wMax++; else if (t.type === 'soldier') sMax++; }
    return { w, s, wMax, sMax, active: w + s, max: wMax + sMax };
  }

  function refreshLevelHUD() {
    if (!S) return;
    const P = levelPop();
    hud.food.textContent = Math.floor(S.food); hud.cap.textContent = '/' + levelFoodCap(S);
    hud.worker.textContent = P.w; hud.wcap.textContent = P.wMax ? ('/' + P.wMax) : '';
    hud.soldier.textContent = P.s; hud.scap.textContent = P.sMax ? ('/' + P.sMax) : '';
    hud.wwrap.style.display = ''; hud.swrap.style.display = '';
    hud.bwrap.style.display = 'none'; hud.jwrap.style.display = 'none'; hud.lwrap.style.display = '';
    hud.larva.textContent = S.larva;
    setHudExtra('活跃 ' + P.active + '/' + P.max + (P.max ? '' : '·无孵化方格') + ' · 威胁 ' + threatsLeft() + ' · 队' + 'ⅠⅡⅢⅣⅤ'[S.selSquad] + ' ' + S.ants.filter(a => a.squad === S.selSquad).length + '只');
  }

  function refreshLevelBottom() {
    if (!S) return;
    const tab = S.uiTab;
    let html = '';
    const armBtn = (k, nm) => { const d = BUILD[k], dis = S.food < d.cost; return `<button class="pbtn ${buildMode === k ? 'active' : ''} ${dis ? 'disabled' : ''}" data-arm="${k}"><span class="p-ico">${d.icon}</span><span class="p-nm">${nm}</span><span class="p-cost">${d.cost}</span></button>`; };
    if (tab === 'build') {
      html += '<div class="panel-row">' + armBtn('storage', '食物仓库') + armBtn('speed', '加速方格') +
        `<button class="pbtn ${buildMode === 'demolish' ? 'active' : ''}" data-arm="demolish"><span class="p-ico">💥</span><span class="p-nm">拆除</span><span class="p-cost">返70%</span></button>` +
        `<button class="pbtn ${buildMode === 'dig' ? 'active' : ''}" data-arm="dig"><span class="p-ico">⛏️</span><span class="p-nm">挖地道</span><span class="p-cost">工蚁</span></button>` + '</div>';
    } else if (tab === 'ants') {
      html += '<div class="panel-row">' + armBtn('worker', '工蚁') + armBtn('soldier', '兵蚁') + '</div>';
      html += '<div class="hint">孵化方格：工蚁去蚁后取卵→卵→白幼虫→黄蛹→耗食物羽化（工蚁 2 / 兵蚁 5）；蚁死后方格快速补。最大种群=孵化方格数</div>';
    } else if (tab === 'pher') {
      html += '<div class="panel-row squads">';
      for (let i = 0; i < 5; i++) html += `<button class="sq ${i === S.selSquad ? 'active' : ''} ${S.squads[i].assigned.size ? 'on' : ''}" data-sq="${i}">${'ⅠⅡⅢⅣⅤ'[i]}<span class="sq-n">${S.squads[i].assigned.size}</span></button>`;
      html += '</div>';
      const s = S.squads[S.selSquad];
      html += `<div class="panel-row sq-opts">
        <button class="tog ${s.allowAttack ? 'on' : 'off'}" id="tog-atk">${s.allowAttack ? '⚔ 攻' : '⚔ 停'}</button>
        <button class="tog ${s.allowCarry ? 'on' : 'off'}" id="tog-carry">${s.allowCarry ? '🍃 搬' : '🍃 停'}</button></div>`;
      html += '<div class="hint">点上方选队伍 → 再点地图放信息素点（该队蚂蚁跟随）· 双击队伍=清空</div>';
    } else {
      html += `<div class="hint">${S.viewLayer === 'surface' ? '地表：选「信息素」选队伍后点地图放信息素点，蚂蚁走竖井上去采集/战斗；点「到地面」回地下' : (S.lv.surface ? '点「到地面」爬上地表：选队伍+放信息素点，工蚁/兵蚁经竖井往返采集与清剿' : '本章为纯地下，无地表（第二章解锁地表）')}</div>`;
    }
    html += '<div class="panel-row main-tabs">' +
      `<button class="pbtn mtab ${tab === 'build' ? 'active' : ''}" data-tab="build"><span class="p-ico">🏛️</span><span class="p-nm">建筑</span></button>` +
      `<button class="pbtn mtab ${tab === 'ants' ? 'active' : ''}" data-tab="ants"><span class="p-ico">🐜</span><span class="p-nm">蚂蚁</span></button>` +
      `<button class="pbtn mtab ${tab === 'pher' ? 'active' : ''}" data-tab="pher"><span class="p-ico">📍</span><span class="p-nm">信息素</span></button>` +
      (S.lv && S.lv.surface ? `<button class="pbtn mtab ${tab === 'surf' ? 'active' : ''}" data-tab="surf"><span class="p-ico">⛰️</span><span class="p-nm">到地面</span></button>` : '') + '</div>';
    bottomContent.innerHTML = html;

    bottomContent.querySelectorAll('[data-arm]').forEach(b => b.onclick = () => {
      const k = b.dataset.arm;
      if (k === 'demolish') buildMode = (buildMode === 'demolish') ? null : 'demolish';
      else buildMode = (buildMode === k) ? null : k;
      S.pheromone = false; Sfx.tap(); refreshLevelBottom();
    });
    bottomContent.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
      S.uiTab = b.dataset.tab;
      if (S.uiTab === 'surf') S.viewLayer = (S.viewLayer === 'surface' ? 'under' : 'surface');
      else S.viewLayer = 'under';
      applyLayerView();
      if (S.uiTab !== 'pher') S.pheromone = false;
      Sfx.tap(); refreshLevelBottom();
    });
    bottomContent.querySelectorAll('[data-sq]').forEach(b => b.onclick = () => {
      const i = parseInt(b.dataset.sq, 10), sqd = S.squads[i], now = Date.now();
      if (sqd._last && now - sqd._last < 320) {
        sqd.assigned.clear();
        for (const k in S.tiles) { const t = S.tiles[k]; if ((t.type === 'soldier' || t.type === 'worker') && t.squad === i) t.squad = -1; }
        toast('已清空队伍 ' + 'ⅠⅡⅢⅣⅤ'[i], 1200); refreshLevelBottom(); return;
      }
      sqd._last = now; S.selSquad = i; S.pheromone = true; buildMode = null; Sfx.tap(); refreshLevelBottom();
      toast('队伍 ' + 'ⅠⅡⅢⅣⅤ'[i] + ' · 点地图放信息素点', 1400);
    });
    const t1 = document.getElementById('tog-atk'); if (t1) t1.onclick = () => { S.squads[S.selSquad].allowAttack = !S.squads[S.selSquad].allowAttack; refreshLevelBottom(); };
    const t2 = document.getElementById('tog-carry'); if (t2) t2.onclick = () => { S.squads[S.selSquad].allowCarry = !S.squads[S.selSquad].allowCarry; refreshLevelBottom(); };
  }

  // 关卡建造/挖掘
  function levelBuildAt(q, r) {
    if (!buildMode) return false;
    if (!inRadius(q, r, S.radius)) return false;
    const key = hkey(q, r);
    const t = S.tiles[key];
    if (t && t.type === 'queen') { toast('蚁后室不能覆盖'); return true; }
    if (t && t.type !== 'dirt' && t.type !== 'tunnel') { toast('这里已经有建筑'); return true; }
    // 需要挨着已有区域
    let adj = false;
    for (const [dq, dr] of DIRS) { const nt = S.tiles[hkey(q + dq, r + dr)]; if (nt && nt.type !== 'dirt') { adj = true; break; } }
    if (!adj) { toast('需要挨着巢穴或已有建筑'); return true; }
    const def = BUILD[buildMode];
    if (S.food < def.cost) { toast('食物不足（需 ' + def.cost + '）'); return true; }
    if (idleWorkers() < 1) { toast('无空闲工蚁去建造，等工蚁空闲（工蚁负责建造/挖地道/取卵）'); return true; }
    S.food -= def.cost;
    const lvl = 1;
    const type = buildMode;
    S.tiles[key] = { type, level: lvl };
    if (type === 'soldier' || type === 'worker') {
      S.tiles[key].squad = S.selSquad;
      S.tiles[key].hatch = { stage: 'empty', t: 0, fast: false };   // 孵化方格生命周期
    }
    if (type === 'soldier') S.builtSoldier++;
    if (type === 'worker') S.builtWorker++;
    Sfx.build();
    // 保持建造模式（连续建造），选中队伍或再点该建筑可退出
    refreshLevelHUD(); refreshBottom();
    checkLevelWin();
    return true;
  }
  function demolishLevel(q, r) {
    const key = hkey(q, r), t = S.tiles[key]; if (!t) return;
    const def = BUILD[t.type];
    const refund = Math.round((def ? def.cost : 5) * 0.7);
    const p = h2p(q, r);
    S.foods.push({ x: p.x + (Math.random() - 0.5) * 20, y: p.y + (Math.random() - 0.5) * 20, amount: refund });
    S.squads.forEach(sq => sq.assigned.delete(key));
    delete S.tiles[key];
    if (t.type === 'soldier') S.builtSoldier = Math.max(0, S.builtSoldier - 1);
    if (t.type === 'worker') S.builtWorker = Math.max(0, S.builtWorker - 1);
    Sfx.dig(); refreshLevelHUD(); refreshLevelBottom();
    toast('拆除 ' + (def ? def.name : t.type) + '，返还 ' + refund + ' 到地表', 1400);
  }
  function levelDigAt(q, r) {
    if (!inRadius(q, r, S.radius)) return;
    const key = hkey(q, r);
    const t = S.tiles[key];
    if (t && t.type !== 'dirt') return;
    let adj = false;
    for (const [dq, dr] of DIRS) { const nt = S.tiles[hkey(q + dq, r + dr)]; if (nt && nt.type !== 'dirt') { adj = true; break; } }
    if (!adj) { toast('需要挨着已有通道挖掘'); return; }
    S.tiles[key] = { type: 'tunnel', level: 1 };
    revealTile(key);
    Sfx.dig();
  }

  // 信息素点：队伍蚂蚁分散到该点周围，而非全挤中心
  function setSquadMarker(idx, q, r) {
    const sq = S.squads[idx]; if (!sq) return;
    sq.marker = { q, r };
    for (const a of S.ants) {
      if (a.squad !== idx) continue;
      const ang = Math.random() * 6.28, rad = 12 + Math.random() * 30;
      a.goalX = q + Math.cos(ang) * rad; a.goalY = r + Math.sin(ang) * rad;
    }
  }

  // 工蚁挖掘：派一只工蚁过去，蹲在格子上把进度挖满才变通道
  function orderDigAt(q, r) {
    if (!inRadius(q, r, S.radius)) return;
    const key = hkey(q, r), t = S.tiles[key];
    if (t && t.type === 'queen') { toast('蚁后室不能挖'); return; }
    if (t && t.type !== 'dirt' && t.type !== 'tunnel') { toast('这里已有建筑'); return; }
    let adj = false;
    for (const [dq, dr] of DIRS) { const nt = S.tiles[hkey(q + dq, r + dr)]; if (nt && nt.type !== 'dirt') { adj = true; break; } }
    if (!adj) { toast('需挨着已有区域'); return; }
    if (!S.tiles[key] || S.tiles[key].type !== 'dirt') S.tiles[key] = { type: 'dirt' };
    S.tiles[key].dig = S.tiles[key].dig || { progress: 0, need: 2 };
    const p = h2p(q, r);
    let best = null, bd = 1e9;
    for (const a of S.ants) { if (a.hp <= 0 || a.carry > 0 || a.digKey) continue; if (a.kind !== 'worker') continue; const d = Math.hypot(a.x - p.x, a.y - p.y); if (d < bd) { bd = d; best = a; } }
    if (best) { best.digKey = key; best.digQ = q; best.digR = r; Sfx.tap(); toast('工蚁前往挖掘地道', 1000); }
    else { toast('没有空闲工蚁：先造工蚁孵化室并分配', 1400); }
    refreshLevelBottom();
  }

  // 关卡内的蚁群升级点数（算法同家）
  function levelColonyPoints() {
    let pts = 0; const seen = new Set();
    const skip = (t) => !t || t.type === 'dirt' || t.type === 'tunnel' || t.type === 'queen';
    for (const key in S.tiles) {
      const t = S.tiles[key]; if (skip(t)) continue;
      const [q, r] = key.split(',').map(Number);
      for (const [dq, dr] of DIRS) {
        const nk = hkey(q + dq, r + dr), nt = S.tiles[nk];
        if (skip(nt)) continue;
        const pair = key < nk ? key + '|' + nk : nk + '|' + key;
        if (seen.has(pair)) continue; seen.add(pair);
        if (t.type === nt.type) pts++;
        else if (t.type === 'speed' || nt.type === 'speed') pts++;
      }
    }
    return pts;
  }

  function openLevelUpgradePanel(q, r) {
    const t = S.tiles[hkey(q, r)];
    if (!t || t.type === 'queen' || t.type === 'tunnel' || t.type === 'dirt') return;
    const def = BUILD[t.type];
    const gen = levelColonyPoints();
    const spent = S.pointsSpent || 0;
    const pool = gen - spent;
    const maxed = t.level >= 3;
    const need = maxed ? 0 : upgradeReq(t.level + 1);
    const cost = def.cost;
    const canUp = !maxed && S.food >= cost && pool >= need;
    let effect = '';
    if (t.type === 'storage') effect = '储存上限 ' + storageCapOf(t.level) + (maxed ? '' : ' → ' + storageCapOf(t.level + 1));
    else if (t.type === 'speed') effect = '移速 +' + Math.round(speedBonusOf(t.level) * 100) + '%' + (maxed ? '' : ' → +' + Math.round(speedBonusOf(t.level + 1) * 100) + '%');
    else effect = '产蚁速度提升';
    const refund = Math.round(def.cost * 0.7);
    showOverlay(`
      <h2>${def.name} Lv.${t.level}</h2>
      <div class="sub">${effect}<br/>可用升级点数 ${pool}（累计 ${gen}，已消耗 ${spent}）<br/>本次升级需 ${maxed ? '—' : need} 点 + ${cost} 食物</div>
      ${maxed ? '<div class="sub">已满级</div>' : `<button class="big-btn" id="ov-up" style="${canUp ? '' : 'opacity:.45'}">升级 · 消耗 ${need} 点 + ${cost} 食物</button>`}
      <button class="ghost-btn" id="ov-dem">拆除 · 返还 ${refund} 食物（落到地表）</button>
      <button class="ghost-btn" id="ov-close">关闭</button>
    `);
    if (!maxed) {
      document.getElementById('ov-up').onclick = () => {
        if (!canUp) return;
        S.food -= cost; S.pointsSpent = spent + need; t.level++;
        Sfx.build(); refreshLevelHUD(); hideOverlay(); refreshLevelBottom();
        toast('升级成功（消耗 ' + need + ' 点）', 1000);
      };
    }
    document.getElementById('ov-dem').onclick = () => {
      const p = h2p(q, r);
      S.foods.push({ x: p.x + (Math.random() - 0.5) * 20, y: p.y + (Math.random() - 0.5) * 20, amount: refund });
      S.squads.forEach(sq => sq.assigned.delete(hkey(q, r)));
      delete S.tiles[hkey(q, r)];
      if (t.type === 'soldier') S.builtSoldier = Math.max(0, S.builtSoldier - 1);
      if (t.type === 'worker') S.builtWorker = Math.max(0, S.builtWorker - 1);
      Sfx.dig(); refreshLevelHUD(); hideOverlay(); refreshLevelBottom();
      toast('拆除 ' + def.name + '，返还 ' + refund + ' 食物到地表（蚂蚁可拾取）', 1500);
    };
    document.getElementById('ov-close').onclick = hideOverlay;
  }

  // ---------------- 关卡更新 ----------------
  function levelUpdate(dt) {
    if (!S || S.over) return;
    S.time += dt;

    // 女王产卵
    S.larvaTimer += dt;
    if (S.larvaTimer >= 3) { S.larvaTimer -= 3; S.larva = Math.min(150, S.larva + 1); }

    // 食物补给（第二关持续刷新，便于扩建）
    S.foodTimer -= dt;
    if (S.foodTimer <= 0) {
      S.foodTimer = S.lv.foodRate || 12;
      if (S.foods.length < (S.lv.foodMax || 20)) {
        const [q, r] = randRing(1, S.radius - 1);
        const p = h2p(q, r);
        S.foods.push({ x: p.x, y: p.y, amount: 30 });
      }
    }

    // 孵化方格生命周期：empty(工蚁取卵) → 卵 → 白幼虫 → 黄蛹 → 羽化(耗食物)
    for (const key in S.tiles) {
      const t = S.tiles[key];
      if (t.type !== 'soldier' && t.type !== 'worker') continue;
      if (!t.hatch) t.hatch = { stage: 'empty', t: 0, fast: false };
      const h = t.hatch;
      if (h.stage === 'active') continue;   // 已有活跃蚁；其死亡时会重置本方格为 empty+fast
      const [qs, rs] = key.split(',').map(Number);
      const squad = (t.squad == null ? -1 : t.squad);
      if (squad < 0) continue;             // 未分配巢组的方格不孵化
      const sq = S.squads[squad];
      if (!sq) continue;
      const fm = h.fast ? 0.5 : 1;          // 补充兵力：死亡后快速孵化
      if (h.stage === 'empty') {
        // 工蚁去蚁后取卵：需有卵(蚁后产)+有空闲工蚁；否则停滞（工蚁不足→卵无法及时搬）
        const canCarry = S.larva > 0 && idleWorkers() > 0;
        if (!canCarry) { h.t = 0; continue; }
        h.t += dt * fm;
        if (h.t >= HATCH_TIME.empty) { h.stage = 'egg'; h.t = 0; S.larva--; }
      } else if (h.stage === 'egg') {
        h.t += dt * fm;
        if (h.t >= HATCH_TIME.egg) { h.stage = 'larva'; h.t = 0; }
      } else if (h.stage === 'larva') {
        h.t += dt * fm;
        if (h.t >= HATCH_TIME.larva) { h.stage = 'pupa'; h.t = 0; }
      } else if (h.stage === 'pupa') {
        const cost = hatchCost(t.type, t.level);
        if (S.food >= cost) {          // 食物不足→蛹阶段卡住；无数量上限：造几格=几蚁
          S.food -= cost;
          const p = h2p(qs, rs);
          const a = makeAnt(t.type, p.x + (Math.random() - 0.5) * 14, p.y + (Math.random() - 0.5) * 14, squad);
          const lm = hatchStatMul(t.level);
          a.hp *= lm; a.maxhp *= lm; a.atk *= lm; a.speed *= (1 + 0.1 * ((t.level || 1) - 1));
          a.hatchKey = key; a.homeQ = qs; a.homeR = rs;
          S.ants.push(a);
          h.stage = 'active'; h.t = 0; h.fast = false;
        }
      }
    }

    // 蛛丝洞穴触发
    for (const w of S.webs) {
      if (w.triggered) continue;
      for (const a of S.ants) {
        if (Math.hypot(a.x - w.x, a.y - w.y) < 32) {
          w.triggered = true;
          const sp = makeEnemy('webSpider', w.x, w.y);
          S.enemies.push(sp);
          toast('蛛丝洞穴被触发了！', 1400);
          break;
        }
      }
    }

    // 敌人
    updateEnemies(dt);
    // 蚂蚁
    updateAnts(dt);
    // 食物
    updateFoods(dt);

    // 敌对蚂蚁来袭（第二关）
    if (S.lv.raid) {
      if (S.raidTimer <= 0) {
        S.raidTimer = 120; S.raidCount++; S.raidStolen = false;
        const [eq, er] = [S.radius, 0];
        // 出口在地图边缘
        for (let i = 0; i < 6; i++) {
          const p = h2p(S.radius - 1, 1 - i % 3);
          const e = makeEnemy('enemyAnt', p.x + (Math.random() - 0.5) * 30, p.y);
          e.raid = true; S.enemies.push(e);
        }
        toast('敌对蚂蚁来袭！', 1600);
      }
    }

    checkLevelWin();
    refreshLevelHUD();
  }

  function tileSpeedMul(x, y) {
    const h = p2h(x, y), t = S.tiles[hkey(h.q, h.r)];
    let mul = 1;
    if (t && t.type === 'speed') mul *= 1 + speedBonusOf(t.level);
    if (t && (t.type === 'soldier' || t.type === 'worker')) mul *= 0.8;
    return mul;
  }

  function updateAnts(dt) {
    const qp = h2p(0, 0);
    for (const a of S.ants) {
      if (a.hp <= 0) continue;
      a.phase += dt * 12;
      const sq = S.squads[a.squad] || { allowAttack: true, allowCarry: true, marker: null };
      const spd = a.speed * tileSpeedMul(a.x, a.y);
      // 工蚁挖掘：被派去挖的工蚁，走到格子上蹲着挖进度
      if (a.digKey) {
        const dt2 = S.tiles[a.digKey];
        if (dt2 && dt2.dig) {
          const p = h2p(a.digQ, a.digR), d = Math.hypot(p.x - a.x, p.y - a.y);
          if (d > 18) moveTo(a, p.x, p.y, spd, dt);
          else {
            dt2.dig.progress += dt; a.state = 'dig';
            if (dt2.dig.progress >= dt2.dig.need) {
              const dk = a.digKey;
              dt2.type = 'tunnel'; delete dt2.dig;
              for (const o of S.ants) if (o.digKey === dk) { o.digKey = null; o.digQ = null; o.digR = null; }
              revealTile(dk);   // 挖通→露出埋藏的敌人/食物
              Sfx.dig();
            }
          }
        } else { a.digKey = null; a.digQ = null; a.digR = null; }
        continue;
      }
      // 携带食物回巢
      if (a.carry > 0) {
        const d = Math.hypot(qp.x - a.x, qp.y - a.y);
        if (d < 26) {
          const room = Math.max(0, levelFoodCap(S) - S.food);
          const put = Math.min(room, a.carry);
          S.food += put; a.carry -= put;
          if (a.carry <= 0) a.carry = 0;
        } else routeMove(a, qp.x, qp.y, spd, dt);
        continue;
      }
      // 允许搬运：捡食物 / 分解尸体
      if (sq.allowCarry && S.food < levelFoodCap(S)) {
        let best = null, bd = 26;
        for (const f of S.foods) { const d = Math.hypot(f.x - a.x, f.y - a.y); if (d < bd) { bd = d; best = f; } }
        if (best) {
          const take = best.surface ? Math.min(best.amount, 40) : Math.min(best.amount, a.carryCap);
          a.carry = take; best.amount -= take;
          if (best.surface) S.harvested = (S.harvested || 0) + take;   // 采集即计入地表目标（不受巢穴存满限制）
          if (best.amount <= 0) S.foods.splice(S.foods.indexOf(best), 1);
          continue;
        }
        // 尸体分解
        let corpse = null, cd = 30;
        for (const c of S.corpses) { const d = Math.hypot(c.x - a.x, c.y - a.y); if (d < cd) { cd = d; corpse = c; } }
        if (corpse) {
          corpse.timer = (corpse.timer || 0) + dt;
          if (corpse.timer >= 2) {
            corpse.timer = 0;
            const room = Math.max(0, levelFoodCap(S) - S.food);
            S.food += Math.min(40, room);
            corpse.left--;
            if (corpse.left <= 0) S.corpses.splice(S.corpses.indexOf(corpse), 1);
          }
          continue;
        }
      }
      // 攻击
      let enemy = null, ed = 9999;
      for (const e of S.enemies) { const d = Math.hypot(e.x - a.x, e.y - a.y); if (d < ed) { ed = d; enemy = e; } }
      if (sq.allowAttack && enemy && ed < 55) {
        a.angle = Math.atan2(enemy.y - a.y, enemy.x - a.x);
        a.cd -= dt;
        if (a.cd <= 0) { a.cd = 0.6; enemy.hp -= a.atk; Sfx.hit(); }
        continue;
      }
      if (!sq.allowAttack && enemy && ed < 60) {
        // 避开
        const ang = Math.atan2(a.y - enemy.y, a.x - enemy.x);
        a.x += Math.cos(ang) * spd * dt; a.y += Math.sin(ang) * spd * dt;
        continue;
      }
      // 前往本队伍的信息素点（每只蚁取该点周围一个随机目标位，散开成一群）
      if (sq.marker) {
        const gx = a.goalX != null ? a.goalX : sq.marker.q;
        const gy = a.goalY != null ? a.goalY : sq.marker.r;
        const md = Math.hypot(gx - a.x, gy - a.y);
        if (md > 10) routeMove(a, gx, gy, spd, dt); else a.state = 'wait';
      } else {
        a.goalX = null; a.goalY = null; a.state = 'idle';
        // 兵蚁守在蚁后附近；工蚁在巢口附近游走（让蚁群看起来是活的）
        const R = a.kind === 'soldier' ? 34 : 110;
        const rr = a.kind === 'soldier' ? 8 : 12;
        if (!a.wander || Math.hypot(a.x - a.wander.x, a.y - a.wander.y) < rr || Math.random() < dt * 0.4) {
          a.wander = { x: qp.x + (Math.random() - 0.5) * R, y: qp.y + (Math.random() - 0.5) * R };
        }
        moveTo(a, a.wander.x, a.wander.y, spd * (a.kind === 'soldier' ? 0.5 : 0.45), dt);
      }
    }
  }

  function moveTo(a, tx, ty, spd, dt) {
    const dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy);
    if (d < 1) return;
    a.angle = Math.atan2(dy, dx);
    const step = Math.min(d, spd * dt);
    a.x += dx / d * step; a.y += dy / d * step;
  }

  function updateEnemies(dt) {
    const qp = h2p(0, 0);
    for (const e of S.enemies) {
      if (e.hp <= 0) { if (!e.dead) { e.dead = true; killEnemy(e); } continue; }
      e.phase += dt * 10;
      const ez = e.zone || 'under';
      // 目标：本区最近蚂蚁；无目标时——地表昆虫在清地游走（够不着蚁后），地下敌人冲向蚁后
      let target = null, td = 9999;
      for (const a of S.ants) { if (a.hp <= 0) continue; if (zoneOf(a.x, a.y) !== ez) continue; const d = Math.hypot(a.x - e.x, a.y - e.y); if (d < td) { td = d; target = a; } }
      if (!target || td > 260) {
        if (ez === 'surface') {
          if (!e.swander || Math.hypot(e.x - e.swander.x, e.y - e.swander.y) < 8 || Math.random() < dt * 0.4)
            e.swander = { x: SURF_C.x + (Math.random() - 0.5) * SURF_R * 1.2, y: SURF_C.y + (Math.random() - 0.5) * SURF_R * 0.8 };
          e.angle = Math.atan2(e.swander.y - e.y, e.swander.x - e.x);
          const sd = Math.hypot(e.swander.x - e.x, e.swander.y - e.y);
          if (sd > 4) { const st2 = e.speed * dt; e.x += (e.swander.x - e.x) / sd * st2; e.y += (e.swander.y - e.y) / sd * st2; }
          continue;
        }
        target = qp; td = Math.hypot(qp.x - e.x, qp.y - e.y);
      }
      const tx = target === qp ? qp.x : target.x;
      const ty = target === qp ? qp.y : target.y;
      const d = Math.hypot(tx - e.x, ty - e.y);
      const reach = (e.size || 1) * 14 + 16;
      if (d > reach) {
        e.angle = Math.atan2(ty - e.y, tx - e.x);
        const step = e.speed * dt;
        e.x += (tx - e.x) / d * step; e.y += (ty - e.y) / d * step;
      } else {
        e.cd -= dt;
        if (e.cd <= 0) {
          e.cd = 0.8;
          if (target === qp) {
            if (e.kind === 'webSpider') { /* 蛛丝蜘蛛只针对蚂蚁 */ }
            else if (e.raid) {
              if (!S.raidStolen) {
                S.raidStolen = true;
                if (S.larva >= 10) { S.larva -= 10; toast('敌对蚂蚁偷走 10 只幼蚁', 1400); }
                else { S.larva = 0; S.queenHp -= 40; toast('没有幼蚁可偷，敌对蚂蚁攻击蚁后！', 1600); if (S.queenHp <= 0) loseLevel(); }
                S.enemies.forEach(x => { if (x.raid) x.retreat = true; });
              }
            } else S.queenHp -= e.atk;
            if (S.queenHp <= 0) loseLevel();
          } else {
            target.hp -= e.atk;
            if (target.hp <= 0 && !target.dead) { target.dead = true; }
          }
        }
      }
      if (e.retreat) {
        e.x += (S.radius * 80 - e.x) * dt * 0.5; // 粗略向边缘撤离
        if (Math.abs(e.x) > S.radius * 70) e.dead = true;
      }
    }
    // 清理死亡
    S.enemies = S.enemies.filter(e => !e.dead);
    // 蚂蚁死亡：其孵化方格重新取卵，快速羽化补充兵力
    S.ants = S.ants.filter(a => {
      if (a.hp > 0) return true;
      if (a.hatchKey && S.tiles[a.hatchKey]) { S.tiles[a.hatchKey].hatch = { stage: 'empty', t: 0, fast: true }; }
      return false;
    });
    // 第一关胜利
    if (S.lv.kind === 'clear' && threatsLeft() === 0 && S.time > 2) winLevel();
  }

  function updateFoods(dt) {
    // 食物自然不刷新；尸体计时由蚂蚁分解处理
  }

  // 对敌人造成伤害时处理死亡奖励
  function killEnemy(e) {
    if (e.kind === 'mealworm') {
      S.food = Math.min(levelFoodCap(S), S.food + 50);
      toast('面包虫 +50 食物', 900);
    } else if (e.kind === 'sowbug') {
      S.corpses.push({ x: e.x, y: e.y, left: 2, timer: 0 });
      toast('鼠妇留下尸体，可分解 2 次（每次 40）', 1400);
    } else if (e.kind === 'spider') {
      S.food = Math.min(levelFoodCap(S), S.food + 30);
      toast('蜘蛛掉落食物 +30', 900);
    } else if (e.kind === 'webSpider') {
      S.food = Math.min(levelFoodCap(S), S.food + 50);
      toast('蛛丝蜘蛛掉落食物 +50', 900);
    }
  }

  function loseLevel() {
    if (!S || S.over) return;
    S.over = true; Sfx.lose();
    setTimeout(() => {
      showOverlay(`<div class="art">💀</div><h2>蚁巢陷落</h2>
        <div class="sub">${S.def.name}<br/>蚁后血量归零</div>
        <button class="big-btn" id="ov-retry">再试一次</button>
        <button class="ghost-btn" id="ov-home">返回蚁丘</button>`);
      document.getElementById('ov-retry').onclick = () => { hideOverlay(); startLevel(S.idx); };
      document.getElementById('ov-home').onclick = () => { hideOverlay(); enterHome(home); };
    }, 600);
  }

  function winLevel() {
    if (!S || S.over || S.win) return;
    S.win = true; Sfx.win();
    // 通关后不结束，可继续游玩；点 ← 回家时再结算
    toast('目标达成！可继续游玩，点 ← 回家结算', 2800);
  }

  function settleAndHome() {
    if (S && S.win) {
      home.cleared[S.idx] = true;
      home.surfaceFood += Math.floor(Math.min(S.food, levelFoodCap(S)));
      home.digBlocks += 10 + S.idx * 5;
      home.jelly += 6 + S.idx * 4;
      persist();
      toast('回蚁丘：食物 ' + Math.floor(Math.min(S.food, levelFoodCap(S))) + ' 送到蚁丘地表，点地表收取；方块 +' + (10 + S.idx * 5) + ' · 蚁皇浆 +' + (6 + S.idx * 4), 2600);
    } else {
      toast('撤离：未通关，不结算奖励', 1600);
    }
    S = null;
    enterHome(home);
  }

  // =========================================================
  //  渲染
  // =========================================================
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0a0704'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(fit.offX, fit.offY); ctx.scale(fit.scale, fit.scale);
    ctx.beginPath(); ctx.rect(0, 0, LW, LH); ctx.clip();

    if (screen === 'home' && home) renderHome();
    else if (screen === 'level' && S) renderLevel();
    else renderIdleBg();

    ctx.restore();
    // 边缘暗角（压迫感）：中心正常，四周发黑
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const vw = canvas.width / dpr, vh = canvas.height / dpr;
    const vg = ctx.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * 0.32, vw / 2, vh / 2, Math.max(vw, vh) * 0.78);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.74)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, vw, vh);
  }

  function renderIdleBg() {
    // 深色岩洞基底（上略亮、下发黑）
    const g = ctx.createLinearGradient(0, 0, 0, LH);
    g.addColorStop(0, '#1c150e'); g.addColorStop(0.5, '#140f09'); g.addColorStop(1, '#0a0705');
    ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);
    // 岩层 / 土壤斑驳纹理（固定种子，不闪烁）
    for (let i = 0; i < 240; i++) {
      const x = (i * 137.3) % LW, y = (i * 91.7) % LH, r = 3 + (i % 8);
      ctx.fillStyle = (i % 4 === 0) ? 'rgba(150,120,70,.05)' : 'rgba(0,0,0,.10)';
      ctx.beginPath(); ctx.ellipse(x, y, r * 1.7, r * 0.9, (i * 0.7), 0, 7); ctx.fill();
    }
    // 零星苔藓（去饱和绿）
    ctx.fillStyle = 'rgba(70,96,52,.10)';
    for (let i = 0; i < 40; i++) { const x = (i * 211.3) % LW, y = (i * 137.9) % LH; ctx.beginPath(); ctx.ellipse(x, y, 8 + (i % 6), 5 + (i % 4), 0, 0, 7); ctx.fill(); }
    // 中心微光（压迫感）
    const rg = ctx.createRadialGradient(LW / 2, LH * 0.46, 10, LW / 2, LH * 0.46, LH * 0.55);
    rg.addColorStop(0, 'rgba(170,140,85,.14)'); rg.addColorStop(0.6, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, LH, LH);
  }

  function hexPath(cx, cy, size) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const ang = Math.PI / 180 * (60 * i - 30);
      const x = cx + size * Math.cos(ang), y = cy + size * Math.sin(ang);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function renderHome() {
    renderIdleBg();
    // 标题
    ctx.textAlign = 'center'; ctx.fillStyle = '#f0b429'; ctx.font = 'bold 18px system-ui';
    ctx.fillText('蚁丘 · ' + home.name, LW / 2, 66);
    // 地表条（顶部）：暗苔绿、去饱和
    const bTop = 80, bH = 64;
    let g = ctx.createLinearGradient(0, bTop, 0, bTop + bH); g.addColorStop(0, '#2a3818'); g.addColorStop(1, '#15200f');
    ctx.fillStyle = g; ctx.fillRect(16, bTop, LW - 32, bH);
    ctx.strokeStyle = '#3a2c18'; ctx.lineWidth = 2; ctx.strokeRect(16, bTop, LW - 32, bH);
    // 出入口
    ctx.fillStyle = '#0d0804'; ctx.fillRect(LW / 2 - 14, bTop + bH - 2, 28, 12);
    // 地表食物堆（点地表收取进仓库，工蚁不自动搬）
    const piles = Math.ceil((home.surfaceFood || 0) / 20);
    for (let i = 0; i < Math.min(9, piles); i++) {
      const px = 52 + i * (LW - 104) / Math.max(1, Math.min(9, piles) - 1 || 1);
      ctx.fillStyle = '#8a6a34'; ctx.beginPath(); ctx.ellipse(px, bTop + bH * 0.42, 9, 6, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(px, bTop + bH * 0.42 + 2, 9, 3, 0, 0, 7); ctx.fill();
    }
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(220,205,175,.85)'; ctx.font = '11px system-ui';
    ctx.fillText('地表食物 ' + Math.floor(home.surfaceFood || 0) + ' · 点地表收取', 22, bTop + 16);
    if (!piles) { ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(200,190,160,.4)'; ctx.fillText('地表暂无食物（通关/拆除会落到这里）', LW / 2, bTop + bH * 0.5 + 3); }
    // 巢
    ctx.save();
    ctx.translate(view.cx + view.ox, view.cy + view.oy); ctx.scale(view.s, view.s * TILT);
    drawHexGrid(home.tiles, HOME_RADIUS, true);
    ctx.restore();
    // 资源行
    ctx.fillStyle = 'rgba(200,170,120,.75)'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('仓库 ' + Math.floor(home.food) + '/' + homeStorage(home) + ' · 挖掘方块 ' + home.digBlocks + ' · 蚁皇浆 ' + Math.floor(home.jelly) + ' · 升级点数 ' + (colonyPoints(home) - (home.pointsSpent || 0)), LW / 2, 360);
    ctx.fillStyle = 'rgba(230,210,180,.5)'; ctx.font = '11px system-ui';
    ctx.fillText('点泥土挖掘 · 选建筑后点空位建造 · 长按建筑升级', LW / 2, LH - 18);
  }
  function antColorHome() { const c = COLORS[home.color]; return { body: c.body, dark: c.dark, head: c.head }; }

  function drawSurfaceWorld() {
    // 蚁丘地面（暗苔绿，边缘渐黑）
    const sg = ctx.createRadialGradient(0, 0, 10, 0, 0, LEVEL_RADIUS * HEX * 1.732 + 30);
    sg.addColorStop(0, 'rgba(50,70,32,.55)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(0, 0, LEVEL_RADIUS * HEX * 1.732 + 30, 0, 7); ctx.fill();
    // 中心蚁丘
    ctx.fillStyle = '#3a2a18'; ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 22, 40, 14, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(220,205,175,.85)'; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center'; ctx.fillText('蚁丘', 0, 4);
    // 食物堆（暗土黄 + 顶部微光）
    for (const f of S.foods) {
      ctx.fillStyle = '#8a6a30'; ctx.beginPath(); ctx.ellipse(f.x, f.y, 9, 6, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(200,170,90,.4)'; ctx.beginPath(); ctx.ellipse(f.x - 2, f.y - 2, 5, 3, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(f.x, f.y + 3, 9, 4, 0, 0, 7); ctx.fill();
    }
    // 蛛丝洞穴
    for (const w of S.webs) {
      ctx.fillStyle = 'rgba(230,230,245,.3)'; ctx.beginPath(); ctx.arc(w.x, w.y, 26, 0, 7); ctx.fill();
      ctx.font = '22px system-ui'; ctx.textAlign = 'center'; ctx.fillText('🕸️', w.x, w.y + 8);
    }
    // 蜘蛛（地表敌人）
    for (const e of S.enemies) if (e.kind === 'spider' || e.kind === 'webSpider') { ctx.font = '24px system-ui'; ctx.textAlign = 'center'; ctx.fillText('🕷️', e.x, e.y + 8); }
    // 出入口（6 个边缘）
    const R = LEVEL_RADIUS * HEX * 1.732;
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3, x = Math.cos(a) * R, y = Math.sin(a) * R;
      ctx.fillStyle = '#2a1a0e'; ctx.beginPath(); ctx.ellipse(x, y, 15, 10, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.font = '8px system-ui'; ctx.textAlign = 'center'; ctx.fillText('出入口', x, y + 3);
    }
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('— 地表（蜘蛛 / 食物 / 出入口）—', 0, -(LEVEL_RADIUS * HEX * 1.732 + 40));
  }

  function renderLevel() {
    renderIdleBg();
    ctx.save();
    ctx.translate(view.cx + view.ox, view.cy + view.oy); ctx.scale(view.s, view.s * TILT);
    const vz = S.viewLayer;                              // 'under' | 'surface'
    const inVz = (x, y) => (vz === 'surface' ? zoneOf(x, y) === 'surface' : zoneOf(x, y) === 'under');
    if (vz === 'under') {
      drawHexGrid(S.tiles, LEVEL_RADIUS, false);
      // 挖掘进度（工蚁正在挖的地道）
      for (const key in S.tiles) { const td = S.tiles[key]; if (!td.dig) continue; const dd = key.split(','), pp = h2p(+dd[0], +dd[1]), fr = td.dig.progress / td.dig.need;
        ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(pp.x, pp.y, 10, 0, 7); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,190,50,.95)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(pp.x, pp.y, 10, -Math.PI / 2, -Math.PI / 2 + fr * 6.2832); ctx.stroke();
        ctx.fillStyle = 'rgba(255,190,50,.9)'; ctx.font = '8px system-ui'; ctx.textAlign = 'center'; ctx.fillText('挖掘', pp.x, pp.y - 13);
      }
      // 前线泥土上的隐患提示
      if (S.buried) for (const bk in S.buried) {
        if (!isFrontierSoil(bk)) continue;
        const bb = S.buried[bk], bd = bk.split(','), bp = h2p(+bd[0], +bd[1]);
        if (bb.enemy) {
          ctx.fillStyle = 'rgba(180,60,40,.30)'; ctx.beginPath(); ctx.ellipse(bp.x, bp.y, HEX * 0.5, HEX * 0.4, 0, 0, 7); ctx.fill();
          ctx.fillStyle = 'rgba(235,120,90,.9)'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('!', bp.x, bp.y);
        } else if (bb.food) {
          ctx.fillStyle = 'rgba(200,160,70,.22)'; ctx.beginPath(); ctx.ellipse(bp.x, bp.y, HEX * 0.5, HEX * 0.4, 0, 0, 7); ctx.fill();
          ctx.fillStyle = 'rgba(210,180,90,.75)'; ctx.font = '9px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('食', bp.x, bp.y);
        }
        ctx.textBaseline = 'alphabetic';
      }
      // 蛛丝洞穴
      for (const w of S.webs) {
        if (w.triggered) continue;
        ctx.fillStyle = 'rgba(220,220,235,.18)'; ctx.beginPath(); ctx.arc(w.x, w.y, 26, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(230,230,245,.4)'; ctx.lineWidth = 1.5;
        for (let i = 0; i < 8; i++) { const a = i / 8 * 6.28; ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(w.x + Math.cos(a) * 30, w.y + Math.sin(a) * 30); ctx.stroke(); }
      }
      // 竖井（巢穴顶端的洞口，去地表）
      if (S.shafts) { const sh = S.shafts.under; ctx.fillStyle = '#0d0804'; ctx.beginPath(); ctx.ellipse(sh.x, sh.y, 16, 10, 0, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(210,180,110,.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(sh.x, sh.y, 16, 10, 0, 0, 7); ctx.stroke(); ctx.fillStyle = 'rgba(220,205,175,.9)'; ctx.font = '9px system-ui'; ctx.textAlign = 'center'; ctx.fillText('↕ 竖井', sh.x, sh.y - 16); }
    } else {
      drawSurfaceGround();
    }
    // 食物（仅本区）
    for (const f of S.foods) {
      if (!inVz(f.x, f.y)) continue;
      const r = 3 + Math.min(5, f.amount / 8);
      ctx.fillStyle = f.surface ? '#b98a34' : '#8a6a30';
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(210,180,90,.5)'; ctx.beginPath(); ctx.arc(f.x - r * 0.25, f.y - r * 0.25, r * 0.5, 0, 7); ctx.fill();
    }
    // 尸体（仅本区）
    for (const c of S.corpses) {
      if (!inVz(c.x, c.y)) continue;
      ctx.fillStyle = '#4a3320'; ctx.beginPath(); ctx.ellipse(c.x, c.y, 7, 5, 0.3, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(210,190,140,.7)'; ctx.font = '8px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(String(c.left), c.x, c.y - 8);
    }
    // 单位（仅本区，按 2.5D 深度 y 远→近 排序）
    const units = [];
    for (const e of S.enemies) if (inVz(e.x, e.y)) units.push({ d: e.y, f: () => drawEnemy(e) });
    for (const a of S.ants) if (a.hp > 0 && inVz(a.x, a.y)) units.push({ d: a.y, f: () => drawAnt(a.x, a.y, a.angle, a.kind === 'soldier' ? 1.35 : 1.05, antColor(a), a.phase, a.carry) });
    units.sort((p, q) => p.d - q.d);
    for (const u of units) u.f();
    // 信息素（本区）
    const sq = S.squads[S.selSquad];
    if (sq && sq.marker && inVz(sq.marker.q, sq.marker.r)) {
      const m = sq.marker;
      const g = ctx.createRadialGradient(m.q, m.r, 1, m.q, m.r, 22);
      g.addColorStop(0, sq.allowAttack ? 'rgba(190,50,35,.5)' : 'rgba(120,190,90,.45)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(m.q, m.r, 22, 0, 7); ctx.fill();
      ctx.strokeStyle = sq.allowAttack ? 'rgba(210,90,60,.8)' : 'rgba(150,210,120,.8)';
      ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(m.q, m.r, 8, 0, 7); ctx.stroke();
    }
    // 蚁后（仅地下）
    if (vz === 'under') {
      const qp = h2p(0, 0);
      ctx.save(); ctx.translate(qp.x, qp.y);
      ctx.strokeStyle = 'rgba(240,180,41,.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, HEX * 1.6, 0, 7); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    // 顶部关卡信息（亮色，适配暗背景 + 顶部遮光条）
    const topScrim = ctx.createLinearGradient(0, 0, 0, 90); topScrim.addColorStop(0, 'rgba(0,0,0,.62)'); topScrim.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = topScrim; ctx.fillRect(0, 0, LW, 90);
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(232,214,170,.95)'; ctx.font = 'bold 17px system-ui';
    ctx.fillText(S.lv.name + ' · ' + S.lv.sub + '  ' + S.lv.chapter, LW / 2, 34);
    ctx.fillStyle = 'rgba(200,185,150,.85)'; ctx.font = '11px system-ui';
    ctx.fillText(levelObjectiveText(), LW / 2, 54);
    ctx.fillStyle = 'rgba(190,175,145,.75)'; ctx.font = '10px system-ui';
    ctx.fillText('蚁后 ❤ ' + Math.max(0, Math.ceil(S.queenHp)) + '  ·  升级点数 ' + (levelColonyPoints() - (S.pointsSpent || 0)) + (S.win ? '  ·  ✅ 已通关·继续游玩' : ''), LW / 2, 72);
    const bottomScrim = ctx.createLinearGradient(0, LH - 40, 0, LH); bottomScrim.addColorStop(0, 'rgba(0,0,0,0)'); bottomScrim.addColorStop(1, 'rgba(0,0,0,.6)');
    ctx.fillStyle = bottomScrim; ctx.fillRect(0, LH - 40, LW, 40);
    if (buildMode && buildMode !== 'demolish' && buildMode !== 'dig') {
      ctx.fillStyle = 'rgba(232,214,170,.9)'; ctx.font = '11px system-ui';
      ctx.fillText('放置：' + BUILD[buildMode].name + '（点地图空位）', LW / 2, LH - 18);
    } else if (buildMode === 'demolish') {
      ctx.fillStyle = 'rgba(224,120,90,.95)'; ctx.font = '11px system-ui';
      ctx.fillText('拆除：点一个建筑（返还 70% 食物到地表）', LW / 2, LH - 18);
    } else if (buildMode === 'dig') {
      ctx.fillStyle = 'rgba(232,214,170,.9)'; ctx.font = '11px system-ui';
      ctx.fillText('挖掘：点需挖掘的空地，工蚁会过去挖开地道', LW / 2, LH - 18);
    } else if (S.pheromone) {
      ctx.fillStyle = 'rgba(190,230,150,.9)'; ctx.font = '11px system-ui';
      ctx.fillText('信息素：点地图为该队（' + 'ⅠⅡⅢⅣⅤ'[S.selSquad] + '）放信息素点', LW / 2, LH - 18);
    }
  }

  function drawHexGrid(tiles, radius, isHome) {
    for (let q = -radius; q <= radius; q++) {
      for (let r = Math.max(-radius, -q - radius); r <= Math.min(radius, -q + radius); r++) {
        const p = h2p(q, r);
        const t = tiles[hkey(q, r)];
        let fill = '#241a11', stroke = 'rgba(0,0,0,.4)';
        if (t && t.type === 'tunnel') fill = '#0e0906';
        else if (t && t.type === 'queen') fill = '#33240f';
        else if (t && t.type === 'worker') fill = '#2c3418';
        else if (t && t.type === 'soldier') fill = '#3a1c12';
        else if (t && t.type === 'storage') fill = '#2c2414';
        else if (t && t.type === 'speed') fill = '#142a26';
        hexPath(p.x, p.y, HEX - 1);
        ctx.fillStyle = fill; ctx.fill();
        ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke();
        if (t && t.type !== 'dirt' && t.type !== 'tunnel') {
          // 投影基座（让建筑落在地上）
          ctx.fillStyle = 'rgba(0,0,0,.4)';
          ctx.beginPath(); ctx.ellipse(p.x, p.y + HEX * 0.5, HEX * 0.62, HEX * 0.28, 0, 0, 7); ctx.fill();
          if (t.type === 'queen') {
            const gg = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, HEX * 1.5);
            gg.addColorStop(0, 'rgba(150,110,45,.4)'); gg.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(p.x, p.y, HEX * 1.5, 0, 7); ctx.fill();
            drawQueen(p.x, p.y, HEX);
          } else if ((t.type === 'worker' || t.type === 'soldier') && t.hatch && t.hatch.stage !== 'active') {
            drawHatchStage(p.x, p.y, t, HEX);
          } else {
            const icon = BUILD[t.type].icon;
            ctx.globalAlpha = .85; ctx.font = (HEX * 0.62) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = '#c9b48c'; ctx.fillText(icon, p.x, p.y - (t.level > 1 ? 4 : 0));
            ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
          }
          if (t.level > 1) {
            ctx.fillStyle = '#c9a84a'; ctx.font = (HEX * 0.26) + 'px system-ui';
            ctx.fillText('Lv' + t.level, p.x, p.y + HEX * 0.55);
          }
        }
        // 可挖掘前线提示（家 + 关卡）
        if ((!t || t.type === 'dirt')) {
          let adj = false;
          for (const [dq, dr] of DIRS) { const nt = tiles[hkey(q + dq, r + dr)]; if (nt && nt.type !== 'dirt') { adj = true; break; } }
          if (adj) {
            ctx.strokeStyle = 'rgba(200,160,80,.35)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
            hexPath(p.x, p.y, HEX - 4); ctx.stroke(); ctx.setLineDash([]);
          }
        }
      }
    }
  }

  function drawHatchStage(x, y, t, hex) {
    const h = t.hatch;
    // 空槽（孵化方格底座）
    ctx.strokeStyle = 'rgba(200,180,130,.3)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(x, y, hex * 0.46, hex * 0.32, 0, 0, 7); ctx.stroke();
    let frac = 0;
    if (h.stage === 'egg') {
      frac = Math.min(1, h.t / HATCH_TIME.egg);
      ctx.fillStyle = '#e8e2d0';

  function drawAnt(x, y, ang, s, colors, phase, carry) {
    // 地面投影（压扁在地面）
    ctx.fillStyle = 'rgba(0,0,0,.34)'; ctx.beginPath(); ctx.ellipse(x, y + 1.5 * s, 7 * s, 2.8 * s, 0, 0, 7); ctx.fill();

  function collectSurface() {
    const cap = homeStorage(home);
    if ((home.surfaceFood || 0) <= 0) { toast('地表暂无食物', 900); return; }
    const room = Math.max(0, cap - home.food);
    if (room <= 0) { toast('仓库已满，先建更多食物存储区', 1200); return; }
    const take = Math.min(25, Math.floor(home.surfaceFood), room);
    home.food += take; home.surfaceFood -= take;
    Sfx.tap(); refreshHomeHUD();
    toast('收取 +' + take + ' 食物入库（地表余 ' + Math.floor(home.surfaceFood) + '）', 1100);
  }

  function handleHomeTap(lx, ly) {
    // 点顶部地表条 -> 收取食物进仓库
    if (ly >= 74 && ly <= 150) { collectSurface(); return; }
    const h = worldHex(lx, ly);
    if (hdist(h.q, h.r, 0, 0) > HOME_RADIUS) return;
    const t = homeTile(home, h.q, h.r);
    if (buildMode) {
      homeBuildAt(h.q, h.r);
      return;
    }
    if (!t || t.type === 'dirt') { homeDigAt(h.q, h.r); return; }
    openHomeTilePanel(h.q, h.r);
  }

  function assignHatchery(q, r) {
    const t = S.tiles[hkey(q, r)];
    if (!t) return;
    // 从旧队伍移除
    S.squads.forEach((sq, i) => { if (i !== S.selSquad) sq.assigned.delete(hkey(q, r)); });
    t.squad = S.selSquad;
    S.squads[S.selSquad].assigned.add(hkey(q, r));
    buildMode = null; // 分配后退出建造，方便放信息素
    Sfx.tap();
    toast('已分配到队伍 ' + 'ⅠⅡⅢⅣⅤ'[S.selSquad], 900);
    refreshLevelBottom();
  }

  function handleLevelTap(lx, ly) {
    const w = s2w(lx, ly);
    const h = p2h(w.x, w.y);
    // 地表视图：不能建/挖（地下专属），但能放信息素点（蚂蚁走竖井上去）
    if (S.viewLayer === 'surface') {
      if (buildMode) { toast('地表不能建造/挖掘（先点「到地面」回地下）', 1300); return; }
      setSquadMarker(S.selSquad, w.x, w.y);
      Sfx.tap();
      const cnt = S.ants.filter(a => a.squad === S.selSquad).length;
      toast('队伍 ' + 'ⅠⅡⅢⅣⅤ'[S.selSquad] + ' 已在地表放信息素点' + (cnt ? '' : '（该队还没蚂蚁，先建孵化室并分配）'), 1600);
      return;
    }
    if (hdist(h.q, h.r, 0, 0) > S.radius) return;
    const key = hkey(h.q, h.r);
    // 拆除模式
    if (buildMode === 'demolish') {
      const t = S.tiles[key];
      if (t && t.type !== 'queen' && t.type !== 'dirt' && t.type !== 'tunnel') demolishLevel(h.q, h.r);
      else toast('点一个可拆建筑', 900);
      return;
    }
    if (buildMode === 'dig') { orderDigAt(h.q, h.r); return; }
    if (buildMode) {
      const bt = S.tiles[key];
      if (bt && (bt.type === 'soldier' || bt.type === 'worker')) { assignHatchery(h.q, h.r); return; }
      levelBuildAt(h.q, h.r); return;
    }
    const t = S.tiles[hkey(h.q, h.r)];
    // 点孵化室 -> 分配给当前队伍
    if (t && (t.type === 'soldier' || t.type === 'worker')) {
      assignHatchery(h.q, h.r);
      return;
    }
    // 点已挖开的通道/蚁后巢 -> 放信息素点（该队蚂蚁散开到该点周围）
    if (t && (t.type === 'tunnel' || t.type === 'queen')) {

      Sfx.tap();
      const cnt = S.ants.filter(a => a.squad === S.selSquad).length;

      return;

    if (isFrontierSoil(key)) { inspectSoil(key); return; }
    // 未挖通/离得太远
    toast('需先挖通到这片泥土（前线泥土才能探查/挖掘）', 1300);
  }

      if (screen === 'home' && home) homeUpdate(dt);

    step(sec) { if (!S) return; const n = Math.round((sec || 0) / 0.05); for (let i = 0; i < n; i++) levelUpdate(0.05); render(); },
    placeMarker(wx, wy) { if (!S) return; setSquadMarker(S.selSquad, wx, wy); },
    homeTick(sec) { if (!home) return null; const n = Math.round((sec || 0) / 0.05); for (let i = 0; i < n; i++) homeUpdate(0.05); return { food: Math.round(home.food), surface: Math.round(home.surfaceFood) }; },
    collect() { if (!home) return null; collectSurface(); return { food: Math.round(home.food), surface: Math.round(home.surfaceFood) }; },
    openPanel(q, r) { if (screen === 'home' && home) openHomeTilePanel(q, r); else if (S) openLevelUpgradePanel(q, r); return document.getElementById('overlay').textContent.slice(0, 90); },
    clickDem() { const b = document.getElementById('ov-dem'); if (b) b.click(); return { surface: home ? Math.round(home.surfaceFood) : null, tile: home ? ('2,0' in home.tiles) : null }; },
    setSquad: (i) => { if (S) { S.selSquad = i; refreshLevelBottom(); } },
    render: () => render(),
  };
})();

</script>
</body>
</html>
