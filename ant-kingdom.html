<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#4f9e2a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="The Ants" />
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --soil:#241a11;
  --page1:#15100a; --page2:#0c0906;
  --panel:#241a11; --panel2:#2e2114; --line:#4a3a22; --wood:#6a4f2a;
  --amber:#c98a2a; --amber2:#e0a845; --amber3:#8a5a18;
  --leaf:#6a7a3a; --leaf2:#4a5a28; --danger:#c04a3a;
  --ink:#e6d8ba; --muted:#9a8763;
}
html,body{height:100%;}
body{
  background:radial-gradient(120% 80% at 50% 30%,#1a140c 0%,#0c0906 70%,#060402 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Nunito",system-ui,sans-serif;
  overflow:hidden; user-select:none; -webkit-user-select:none; overscroll-behavior:none; touch-action:manipulation;
}
#app{
  position:fixed; top:0; right:0; bottom:0; left:0; display:flex; flex-direction:column;
  max-width:560px; margin:0 auto; background:#14100b;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 0 50px rgba(0,0,0,.9);
}
.hidden{display:none !important;}

/* HUD（暗色资源条） */
#hud{
  display:flex; align-items:center; gap:6px; padding:8px 10px;
  background:linear-gradient(180deg,#241a11,#1a120a); border-bottom:1px solid var(--line);
  box-shadow:0 3px 12px rgba(0,0,0,.6); z-index:5; flex:0 0 auto;
}
.stat{
  display:flex; align-items:center; gap:3px; font-size:13px; line-height:1;
  padding:6px 8px; background:#2e2114; border:1px solid var(--line); border-radius:11px;
  color:var(--ink); white-space:nowrap; box-shadow:0 2px 4px rgba(0,0,0,.4);
}
.stat .ico{font-size:12px;}
.stat b{color:var(--amber2); font-weight:800;}
.stat i{font-style:normal; color:var(--muted); font-size:10px;}
#hud-extra{color:var(--muted); font-size:11px; margin-left:auto; font-weight:600;}
#btn-back{
  background:#2e2114; color:var(--ink); border:1px solid var(--line); border-radius:11px;
  width:34px; height:34px; font-size:16px; cursor:pointer; flex:0 0 auto;
  box-shadow:0 2px 4px rgba(0,0,0,.5);
}
#btn-back:active{transform:scale(.92);}

/* stage */
#stage{position:relative; flex:1 1 auto; min-height:0; overflow:hidden; background:#0a0704;}
#cv{display:block; width:100%; height:100%; touch-action:none;}
/* 地图缩放控件 */
#zoomctl{position:absolute; right:8px; bottom:10px; display:flex; flex-direction:column; gap:6px; z-index:6;}
#zoomctl button{width:34px; height:34px; border-radius:50%; border:1.5px solid rgba(201,130,26,.5); background:rgba(20,14,8,.82); color:#e8d4a8; font-size:17px; line-height:1; cursor:pointer; padding:0; box-shadow:0 2px 6px rgba(0,0,0,.5);}
#zoomctl button:active{background:rgba(60,44,20,.92);}

.toast{
  position:absolute; left:50%; top:12%; transform:translate(-50%,-6px);
  background:rgba(15,10,6,.92); border:1px solid var(--amber3); color:#e0b860;
  font-size:13px; font-weight:700; padding:8px 16px; border-radius:20px; opacity:0; pointer-events:none;
  transition:opacity .22s, transform .22s; white-space:nowrap; z-index:8;
  box-shadow:0 4px 16px rgba(0,0,0,.6);
}
.toast.show{opacity:1; transform:translate(-50%,0);}

/* overlay（暗卡片） */
.overlay{
  position:absolute; top:0; right:0; bottom:0; left:0; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.66); backdrop-filter:blur(3px); z-index:20; padding:16px;
}
.overlay-card{
  width:min(400px,96%); max-height:90%; overflow-y:auto; text-align:center; padding:24px 20px;
  background:linear-gradient(180deg,#2a1e12,#1c140c); border:2px solid var(--line); border-radius:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,220,160,.06);
}
.overlay-card h1{
  font-size:28px; letter-spacing:3px; margin-bottom:6px; font-weight:900;
  background:linear-gradient(180deg,#f0dca8,#b57a1e); -webkit-background-clip:text; background-clip:text; color:transparent;
}
.overlay-card h2{font-size:20px; color:var(--amber2); margin-bottom:10px; letter-spacing:1px; font-weight:800;}
.overlay-card .sub{color:var(--muted); font-size:13px; line-height:1.7; margin-bottom:16px;}
.overlay-card .art{
  width:104px; height:104px; margin:0 auto 12px; border-radius:24px;
  background:radial-gradient(circle at 50% 40%,#3a2c18,#1a1208); border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:52px;
  box-shadow:inset 0 2px 12px rgba(0,0,0,.6), 0 0 20px rgba(150,100,40,.2);
}
.big-btn{
  display:block; width:100%; padding:15px; margin-top:10px;
  background:linear-gradient(180deg,#3a2c16,#241a11); color:#f0e2c0; border:2px solid var(--amber); border-radius:16px;
  font-size:16px; font-weight:900; letter-spacing:2px; cursor:pointer;
  box-shadow:0 5px 0 #1a1208, 0 0 18px rgba(200,150,50,.25);
}
.big-btn:active{transform:translateY(3px); box-shadow:0 2px 0 #1a1208;}
.ghost-btn{
  display:block; width:100%; padding:12px; margin-top:10px; background:#241a11;
  color:var(--ink); border:2px solid var(--line); border-radius:16px; font-size:14px; font-weight:700; cursor:pointer;
}
.ghost-btn:active{transform:scale(.98);}

/* lists（保存 / 关卡 / 升级） */
.list{display:flex; flex-direction:column; gap:9px; margin-bottom:6px;}
.row-item{
  display:flex; align-items:center; gap:12px; padding:12px 14px; text-align:left;
  background:#241a11; border:2px solid var(--line); border-radius:15px; cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.5);
}
.row-item:active{transform:scale(.985);}
.row-item.locked{opacity:.4; pointer-events:none;}
.row-item .dot{width:22px;height:22px;border-radius:50%; flex:0 0 auto; border:2px solid rgba(0,0,0,.4);}
.row-item .r-info{flex:1; min-width:0;}
.row-item .r-name{font-size:14px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700;}
.row-item .r-sub{font-size:11px; color:var(--muted); margin-top:2px;}
.row-item .r-tag{font-size:13px; color:var(--amber2); font-weight:800;}

/* color picker */
.swatches{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin:14px 0 6px;}
.swatch{
  width:58px; height:58px; border-radius:18px; border:3px solid rgba(0,0,0,.5);
  cursor:pointer; position:relative; box-shadow:0 3px 6px rgba(0,0,0,.5);
}
.swatch.active{border-color:var(--amber2); box-shadow:0 0 16px rgba(200,150,50,.5);}
.swatch span{position:absolute; bottom:-18px; left:0; right:0; font-size:10px; color:var(--muted);}

/* bottom panel（暗色底部操作栏） */
#bottom{
  flex:0 0 auto; background:linear-gradient(180deg,#241a11,#1a120a);
  border-top:1px solid var(--line); padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  z-index:6; max-height:42vh; overflow-y:auto; color:var(--ink);
  box-shadow:0 -4px 16px rgba(0,0,0,.5);
}
.panel-row{display:flex; gap:6px; margin-bottom:6px;}
.panel-row:last-child{margin-bottom:0;}
.pbtn{
  flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:#241a11; border:1.5px solid var(--line); border-radius:13px;
  color:var(--ink); cursor:pointer; padding:7px 4px; gap:1px;
  box-shadow:0 2px 4px rgba(0,0,0,.4);
}
.pbtn:active{transform:scale(.97);}
.pbtn.disabled{filter:grayscale(.6) brightness(.75); opacity:.5;}
.pbtn .p-ico{font-size:15px; line-height:1;}
.pbtn .p-nm{font-size:10px; white-space:nowrap; font-weight:700; color:var(--ink);}
.pbtn .p-cost{font-size:9px; color:var(--muted);}
.pbtn.active{background:linear-gradient(180deg,#5a4420,#3a2a12); border-color:var(--amber); box-shadow:0 0 14px rgba(200,150,50,.4);}
.pbtn.active .p-nm{color:#f0e2c0;}
.pbtn.active .p-cost{color:var(--amber2);}
.panel-row.main-tabs{margin-top:4px;}
.pbtn.mtab{padding:9px 4px;}
.pbtn.mtab .p-ico{font-size:17px;}
.pbtn.mtab .p-nm{font-size:12px; font-weight:800;}
.pbtn.mtab.active{background:linear-gradient(180deg,#5a4420,#3a2a12); border-color:var(--amber); color:#f0e2c0; box-shadow:0 0 14px rgba(200,150,50,.4);}

/* squad row */
.squads{display:flex; gap:6px;}
.sq{
  flex:1; padding:8px 0; background:#241a11; border:1.5px solid var(--line); border-radius:13px;
  color:var(--muted); font-size:14px; font-weight:800; cursor:pointer; position:relative;
}
.sq.active{background:linear-gradient(180deg,#5a4420,#3a2a12); color:#f0e2c0; border-color:var(--amber);}
.sq .sq-n{position:absolute; top:2px; right:4px; font-size:8px; font-weight:400; color:var(--muted);}
.sq.on{box-shadow:inset 0 -3px 0 rgba(200,150,50,.55);}

.sq-opts{display:flex; gap:6px; align-items:stretch;}
.tog{
  flex:1; display:flex; align-items:center; justify-content:center; gap:4px; padding:7px 4px;
  background:#241a11; border:1.5px solid var(--line); border-radius:13px; color:var(--muted);
  font-size:11px; font-weight:700; cursor:pointer;
}
.tog.on{background:#2e3a1e; border-color:#6a8a3a; color:#bcd08a;}
.tog.off{background:#3a1e18; border-color:#a04a3a; color:#d08a7a;}
.maxctl{display:flex; align-items:center; gap:4px; background:#241a11; border:1.5px solid var(--line); border-radius:13px; padding:2px 4px;}
.maxctl button{width:22px;height:24px;background:#2e2114;border:1px solid var(--line);border-radius:8px;color:var(--ink);cursor:pointer;font-size:12px;font-weight:800;}
.maxctl span{font-size:11px; color:var(--muted); min-width:30px; text-align:center; font-weight:700;}

.hint{font-size:10px; color:var(--muted); text-align:center; margin-top:5px; line-height:1.5;}

/* upgrade panel（暗卡片） */
.upg-list{display:flex; flex-direction:column; gap:8px;}
.upg{display:flex; align-items:center; gap:10px; padding:10px 12px; background:#241a11; border:1.5px solid var(--line); border-radius:14px;}
.upg .u-info{flex:1; text-align:left;}
.upg .u-name{font-size:13px; font-weight:700; color:var(--ink);}
.upg .u-sub{font-size:11px; color:var(--muted); margin-top:2px;}
.upg button{padding:8px 12px; border-radius:10px; border:2px solid var(--amber); background:linear-gradient(180deg,#3a2c16,#241a11); color:#f0e2c0; font-size:12px; font-weight:800; cursor:pointer;}
.upg button:disabled{opacity:.4;}

/* 章节分组头 */
.chap-hd{font-size:12px; font-weight:800; color:#c9821a; letter-spacing:1px; padding:12px 4px 5px; text-align:left;}
.chap-hd:first-child{padding-top:2px;}
.row-item.locked{opacity:.42;}

</style>
<title>The Ants · 小小蚁国</title>
</head>
<body>
<div id="app">
  <header id="hud" class="hidden">
    <div class="stat"><span class="ico">🌿</span><b id="hud-food">0</b><i id="hud-cap"></i></div>
    <div class="stat" id="hud-w"><span class="ico">🐜</span><b id="hud-worker">0</b><i id="hud-wcap"></i></div>
    <div class="stat" id="hud-s"><span class="ico">⚔️</span><b id="hud-soldier">0</b><i id="hud-scap"></i></div>
    <div class="stat" id="hud-b"><span class="ico">🧱</span><b id="hud-blocks">0</b></div>
    <div class="stat" id="hud-j"><span class="ico">🧪</span><b id="hud-jelly">0</b></div>
    <div class="stat" id="hud-l"><span class="ico">🥚</span><b id="hud-larva">0</b></div>
    <div class="stat" id="hud-extra"></div>
    <button id="btn-back" aria-label="返回">←</button>
  </header>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="toast" class="toast"></div>
    <div id="overlay" class="overlay hidden"><div class="overlay-card" id="overlay-card"></div></div>
    <div id="zoomctl" class="hidden">
      <button id="z-in" aria-label="放大">＋</button>
      <button id="z-out" aria-label="缩小">－</button>
      <button id="z-reset" aria-label="复位">↺</button>
    </div>
  </main>

  <nav id="bottom" class="hidden">
    <div id="bottom-content"></div>
  </nav>
</div>
<script>
/* =========================================================
   地下蚁国 · Ant Kingdom  (v3 - 家 / 六边形 / 信息素队伍)
   ========================================================= */
(function () {
  'use strict';

  const LW = 540, LH = 960, HEX = 30, SQ3 = Math.sqrt(3);
  const SAVE_KEY = 'antk_v3_homes';
  const LEVEL_RADIUS = 7, HOME_RADIUS = 6;

  const COLORS = [
    { name: '赤褐', body: '#7a2e18', dark: '#3a1408', head: '#8a3a1e' },
    { name: '琥珀', body: '#8a5a1e', dark: '#4a2e0a', head: '#a06a26' },
    { name: '青碧', body: '#1e6a6a', dark: '#0a3434', head: '#2a7a7a' },
    { name: '紫晶', body: '#5a2e7a', dark: '#2a1240', head: '#6a3a8a' },
    { name: '墨黑', body: '#35353f', dark: '#15151a', head: '#47474f' },
  ];

  const BUILD = {
    soldier: { name: '兵蚁孵化室', cost: 50, icon: '⚔' },
    worker: { name: '工蚁孵化室', cost: 5, icon: '🐜' },
    storage: { name: '食物储存区', cost: 5, icon: '🫙' },
    speed: { name: '加速方块', cost: 5, icon: '⚡' },
  };

  // 孵化方格生命周期：empty(工蚁取卵) → egg(卵) → larva(白幼虫) → pupa(黄蛹) → 羽化(耗食物)
  const HATCH_TIME = { empty: 1, egg: 2, larva: 2 };   // 总≈5秒孵化；蛹阶段需食物(不计时)
  function hatchCost(type, level) { const base = type === 'soldier' ? 5 : 2; return Math.round(base * (1 + 0.25 * ((level || 1) - 1))); }
  function hatchStatMul(level) { return 1 + 0.35 * ((level || 1) - 1); }   // 孵化方格升级→蚁更强
  function idleWorkers() { let n = 0; for (const a of S.ants) { if (a.hp <= 0 || a.kind !== 'worker') continue; if (a.carry > 0 || a.digKey) continue; n++; } return n; }
  const BUILD_KEYS = ['soldier', 'worker', 'storage', 'speed'];

  function storageCapOf(level) { return level >= 3 ? 50 : level === 2 ? 30 : 10; }
  function speedBonusOf(level) { return level >= 3 ? 0.3 : level === 2 ? 0.2 : 0.1; }
  function upgradeReq(nextLevel) { return nextLevel === 2 ? 6 : 12; }

  const LEVELS = [
    // 第一章 · 地下（无地表层）
    { chapter: '第一章 · 地下', name: '第一关', sub: '地下清剿', desc: '挖开泥土、击败钻出的全部敌人。', kind: 'clear', surface: false,
      buriedKinds: ['mealworm','mealworm','mealworm','sowbug','sowbug','beetle','beetle','adultBeetle'], buriedFood: 6, foodAmount: 30, foodRate: 12, foodMax: 20 },
    { chapter: '第一章 · 地下', name: '第二关', sub: '扩建蚁巢', desc: '建成 50 兵蚁 + 47 工蚁孵化室。', kind: 'expand', surface: false, raid: true,
      buriedKinds: ['spider','spider','spider','webSpider','webSpider','enemyAnt','enemyAnt'], buriedFood: 22, foodAmount: 40, needS: 50, needW: 47, foodRate: 6, foodMax: 45 },
    // 第二章 · 冲出地表（引入地表层）
    { chapter: '第二章 · 冲出地表', name: '第一关', sub: '登上地表', desc: '打通竖井爬上地表，采集 30 食物。', kind: 'surface', surface: true, forageGoal: 30, surfBugs: ['beetle', 'spider'],
      buriedKinds: [], buriedFood: 4, foodAmount: 30, foodRate: 12, foodMax: 20 },
    { chapter: '第二章 · 冲出地表', name: '第二关', sub: '地表清剿', desc: '清剿全部地表昆虫，并采集 40 食物。', kind: 'surface', surface: true, forageGoal: 40, clearBugs: true, raid: true, surfBugs: ['spider', 'spider', 'beetle', 'beetle'],
      buriedKinds: [], buriedFood: 4, foodAmount: 30, foodRate: 12, foodMax: 20 },
  ];
  const CHAPTERS = Array.from(new Set(LEVELS.map(l => l.chapter)));

  // ① 地表层几何：巢穴在原点(0,0)，地表清地偏到“上方”(y 负)，靠竖井连通
  const SURF_C = { x: 0, y: -660 };   // 地表中心
  const SURF_R = 250;                 // 地表半径
  const SHAFT_S = { x: 0, y: SURF_C.y + SURF_R - 20 };  // 地表入口（靠近巢穴一侧）
  const SHAFT_U = { x: 0, y: -LEVEL_RADIUS * 1.5 * HEX - 6 }; // 地下竖井口（巢穴顶端）

  // ---------------- 六边形 ----------------
  const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
  function hkey(q, r) { return q + ',' + r; }
  function h2p(q, r) { return { x: HEX * SQ3 * (q + r / 2), y: HEX * 1.5 * r }; }
  function p2h(x, y) {
    const q = (SQ3 / 3 * x - 1 / 3 * y) / HEX;
    const r = (2 / 3 * y) / HEX;
    return hexRound(q, r);
  }
  function hexRound(q, r) {
    let x = q, z = r, y = -x - z;
    let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
    const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
    if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
    return { q: rx, r: rz };
  }
  function hdist(aq, ar, bq, br) {
    return (Math.abs(aq - bq) + Math.abs(ar - br) + Math.abs(aq + ar - bq - br)) / 2;
  }
  function inRadius(q, r, rad) { return hdist(q, r, 0, 0) <= rad; }

  // ---------------- 画布 / 输入 ----------------
  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d');
  let fit = { scale: 1, offX: 0, offY: 0 };
  let dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  function resize() {
    const stage = document.getElementById('stage');
    const cssW = stage.clientWidth, cssH = stage.clientHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
    const scale = Math.min(cssW / LW, cssH / LH);
    fit = { scale, offX: (cssW - LW * scale) / 2, offY: (cssH - LH * scale) / 2 };
  }
  window.addEventListener('resize', resize);
  function toLogical(cx, cy) {
    const r = canvas.getBoundingClientRect();
    return { x: (cx - r.left - fit.offX) / fit.scale, y: (cy - r.top - fit.offY) / fit.scale };
  }

  const view = { s: 1, cx: 270, cy: 470, ox: 0, oy: 0 };
  const TILT = 1;   // 平面 2D（俯视偏角关闭；若想恢复 2.5D 压迫感改回 0.7）
  function fitMap(radius) {
    const maxX = HEX * SQ3 * radius + HEX * SQ3 / 2;
    const maxY = HEX * 1.5 * radius + HEX;
    view.s = Math.min(520 / (2 * maxX), 700 / (2 * maxY));
    view.baseS = view.s;
    view.ox = 0; view.oy = 0; view.maxPan = Math.round(view.baseS * (radius * HEX * SQ3));
    view.cx = 270; view.cy = 470;
  }
  function w2s(x, y) { return { x: view.cx + view.ox + x * view.s, y: view.cy + view.oy + y * view.s * TILT }; }
  function s2w(x, y) { return { x: (x - view.cx - view.ox) / view.s, y: (y - view.cy - view.oy) / (view.s * TILT) }; }
  // 颜色明暗（amt -1..1，负数变暗）
  function shade(hex, amt) {
    const c = hex.replace('#', ''); const n = parseInt(c, 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const f = amt < 0 ? 0 : 255, p = Math.abs(amt);
    r = Math.round(r + (f - r) * p); g = Math.round(g + (f - g) * p); b = Math.round(b + (f - b) * p);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  // 缩放（以当前中心为锚点；baseS=1.0×，限幅 0.5×..3×）
  function zoomBy(f) { if (!view.baseS) view.baseS = view.s; view.s = Math.max(view.baseS * 0.5, Math.min(view.baseS * 3, view.s * f)); }
  function resetZoom() { view.s = view.baseS || view.s; view.ox = 0; view.oy = 0; }

  // ---------------- 音效 ----------------
  const Sfx = (function () {
    let a = null;
    function ensure() { if (!a) { try { a = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } return a; }
    function beep(f, d, t, v) {
      const ac = ensure(); if (!ac) return;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = t || 'sine'; o.frequency.value = f;
      g.gain.value = 0; g.gain.linearRampToValueAtTime(v || 0.05, ac.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d + 0.02);
    }
    return {
      resume() { const ac = ensure(); if (ac && ac.state === 'suspended') ac.resume(); },
      tap() { beep(320, 0.08, 'triangle', 0.04); },
      build() { beep(280, 0.12, 'triangle', 0.06); },
      dig() { beep(160, 0.07, 'square', 0.04); },
      hit() { beep(110, 0.05, 'sawtooth', 0.03); },
      win() { beep(660, 0.15, 'sine', 0.07); setTimeout(() => beep(880, 0.25, 'sine', 0.07), 120); },
      lose() { beep(180, 0.4, 'sawtooth', 0.08); },
    };
  })();

  // ---------------- 存档 ----------------
  let homes = [];
  try { homes = JSON.parse(localStorage.getItem(SAVE_KEY) || '[]') || []; } catch (e) { homes = []; }
  homes.forEach(h => {
    if (!h.evolutions) h.evolutions = { hp: 0, atk: 0, speed: 0, carry: 0, bigSoldier: false };
    if (h.pointsSpent == null) h.pointsSpent = 0;
    if (h.surfaceFood == null) h.surfaceFood = 0;
    if (!Array.isArray(h.cleared)) h.cleared = [];
    while (h.cleared.length < LEVELS.length) h.cleared.push(false);
    if (!h.tiles) h.tiles = {};
  });
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(homes)); } catch (e) { } }

  function makeQueenTiles(tiles) {
    tiles[hkey(0, 0)] = { type: 'queen', level: 1 };
    for (const [dq, dr] of DIRS) tiles[hkey(dq, dr)] = { type: 'queen', level: 1 };
  }

  // 敌人名称（探查提示用）
  function enemyName(k) { const m = { mealworm: '面包虫', sowbug: '鼠妇', beetle: '甲虫', adultBeetle: '成年甲虫', spider: '蜘蛛', webSpider: '蛛丝蜘蛛', enemyAnt: '敌对蚁' }; return m[k] || k; }

  // 把静态敌人 + 泥土食物埋进土里（不是开局就在外面），玩家挖掘才钻出
  function plantBuried(st) {
    st.buried = {};
    const lv = st.lv || {};
    const kinds = lv.buriedKinds || [];
    const foodN = lv.buriedFood || 0;
    const foodAmt = lv.foodAmount || 30;
    const used = new Set();
    const put = (obj) => { for (let t = 0; t < 60; t++) { const [q, r] = randRing(2, st.radius); const k = hkey(q, r); if (used.has(k)) continue; used.add(k); st.buried[k] = obj; return; } };
    for (const k of kinds) put({ enemy: k });
    for (let i = 0; i < foodN; i++) put({ food: foodAmt });
  }

  // 挖掘到一格 → 露出埋藏的敌人/食物
  function revealTile(key) {
    const b = S.buried && S.buried[key];
    if (!b) return;
    delete S.buried[key];
    const [q, r] = key.split(',').map(Number);
    const p = h2p(q, r);
    if (b.enemy) {
      S.enemies.push(makeEnemy(b.enemy, p.x, p.y));
      toast('泥土里钻出了：' + enemyName(b.enemy) + '！', 1500);
    } else if (b.food) {
      S.foods.push({ x: p.x + (Math.random() - 0.5) * 14, y: p.y + (Math.random() - 0.5) * 14, amount: b.food });
      toast('挖到泥土食物 +' + b.food, 1000);
    }
  }

  // 前线泥土：本身无建筑且邻接已挖区域（玩家下一步能挖到的土）
  function isFrontierSoil(key) {
    const [q, r] = key.split(',').map(Number);
    if (!inRadius(q, r, S.radius)) return false;
    const t = S.tiles[key];
    if (t && t.type !== 'dirt') return false;
    let adj = false;
    for (const [dq, dr] of DIRS) { const nt = S.tiles[hkey(q + dq, r + dr)]; if (nt && nt.type !== 'dirt') { adj = true; break; } }
    return adj;
  }

  // 探查：告诉玩家这片泥土里有什么（知道哪里危险）
  function inspectSoil(key) {
    const b = S.buried && S.buried[key];
    if (b && b.enemy) toast('⚠ 探查：这片土里有 ' + enemyName(b.enemy) + '，小心挖掘', 1700);
    else if (b && b.food) toast('🍯 探查：有食物（约 ' + b.food + '），挖开收集', 1500);
    else toast('探查：普通泥土，可安全挖掘', 1400);
    Sfx.tap();
  }

  function newHome(colorIdx) {
    const h = {
      id: Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36),
      name: '蚁丘 ' + (homes.length + 1),
      color: colorIdx,
      food: 35, digBlocks: 10, jelly: 0, pointsSpent: 0, surfaceFood: 0,
      evolutions: { hp: 0, atk: 0, speed: 0, carry: 0, bigSoldier: false },
      cleared: LEVELS.map(() => false),
      tiles: {},
    };
    makeQueenTiles(h.tiles);
    homes.push(h); persist();
    return h;
  }

  function homeStorage(h) {
    let cap = 70;
    for (const k in h.tiles) { const t = h.tiles[k]; if (t.type === 'storage') cap += storageCapOf(t.level); }
    return cap;
  }
  function homeForagers() { let n = 0; for (const k in home.tiles) { const t = home.tiles[k]; if (t.type === 'worker') n += t.level; } return Math.max(2, Math.min(10, 2 + n)); }
  function homeUpdate(dt) {
    if (!home) return;
    // 工蚁不自动搬地表食物；玩家点地表收取（见 handleHomeTap）
    home.forPhase = (home.forPhase || 0) + dt;
  }
  function homeTile(h, q, r) { return h.tiles[hkey(q, r)] || null; }
  function isDug(t) { return t && t.type !== 'dirt'; }
  function homeAdjacentDug(h, q, r) {
    for (const [dq, dr] of DIRS) { const t = homeTile(h, q + dq, r + dr); if (isDug(t)) return true; }
    return false;
  }
  function upgradePoints(h, q, r, type) {
    let p = 0;
    for (const [dq, dr] of DIRS) {
      const nt = homeTile(h, q + dq, r + dr); if (!nt) continue;
      if (nt.type === type) p++;
      else if (nt.type === 'speed') p++;
    }
    return p;
  }
  // 蚁群全局升级点数：同类建筑相邻 + 加速方块相邻，均计 1 点（每对只算一次）
  function colonyPoints(h) {
    let pts = 0;
    const seen = new Set();
    const skip = (t) => !t || t.type === 'dirt' || t.type === 'tunnel' || t.type === 'queen';
    for (const key in h.tiles) {
      const t = h.tiles[key]; if (skip(t)) continue;
      const [q, r] = key.split(',').map(Number);
      for (const [dq, dr] of DIRS) {
        const nk = hkey(q + dq, r + dr), nt = h.tiles[nk];
        if (skip(nt)) continue;
        const pair = key < nk ? key + '|' + nk : nk + '|' + key;
        if (seen.has(pair)) continue;
        seen.add(pair);
        if (t.type === nt.type) pts++;
        else if (t.type === 'speed' || nt.type === 'speed') pts++;
      }
    }
    return pts;
  }

  // ---------------- 界面状态 ----------------
  let screen = 'menu';          // menu | saves | color | home | levels | level
  let home = null;              // 当前“家”

  let pointerDown = false, downX = 0, downY = 0, downTime = 0, dragging = false;
  let lastMarkerPoint = null;
  let pressTimer = null;
  const pointers = new Map(); let pinchPrev = 0, gestureMax = 0, pinchPrevC = null, panStart = null, hintedPan = false;

  const hud = {
    root: document.getElementById('hud'),
    food: document.getElementById('hud-food'),
    cap: document.getElementById('hud-cap'),
    worker: document.getElementById('hud-worker'), wcap: document.getElementById('hud-wcap'), wwrap: document.getElementById('hud-w'),
    soldier: document.getElementById('hud-soldier'), scap: document.getElementById('hud-scap'), swrap: document.getElementById('hud-s'),

  // =========================================================

  function showMenu() {

  // =========================================================
  //  家（六边形主基地）

  function enterHome(h) {
    home = h; S = null; screen = 'home'; buildMode = null; selectedHomeTile = null;
    home.forPhase = 0;
    hideOverlay(); fitMap(HOME_RADIUS);
    showHUD(true); showBottom(true); showZoom(true);
    refreshHomeHUD(); refreshBottom();
  }
  function refreshHomeHUD() {
    hud.food.textContent = Math.floor(home.food); hud.cap.textContent = '/' + homeStorage(home);
    hud.blocks.textContent = home.digBlocks; hud.jelly.textContent = Math.floor(home.jelly);
    hud.bwrap.style.display = ''; hud.jwrap.style.display = '';
    hud.wwrap.style.display = 'none'; hud.swrap.style.display = 'none'; hud.lwrap.style.display = 'none';
    setHudExtra('蚁丘 · ' + home.name + ' · 地表 ' + Math.floor(home.surfaceFood || 0));
  }

  function homeBuildAt(q, r) {
    if (!buildMode) return;
    const t = homeTile(home, q, r);
    if (t && t.type !== 'dirt') { toast('这里已经有东西了'); return; }
    if (!homeAdjacentDug(home, q, r)) { toast('需要挨着已有通道'); return; }
    const def = BUILD[buildMode];
    if (home.food < def.cost) { toast('食物不足（需 ' + def.cost + '）'); return; }
    home.food -= def.cost;
    home.tiles[hkey(q, r)] = { type: buildMode, level: 1 };
    Sfx.build();
    refreshHomeHUD(); refreshBottom();
  }
  function homeDigAt(q, r) {
    const t = homeTile(home, q, r);
    if (t && t.type !== 'dirt') return;
    if (!homeAdjacentDug(home, q, r)) { toast('需要挨着已有通道挖掘'); return; }
    if (home.digBlocks <= 0) { toast('挖掘方块已用完（关卡奖励可获得）'); return; }
    home.digBlocks--;
    home.tiles[hkey(q, r)] = { type: 'tunnel', level: 1 };
    Sfx.dig(); refreshHomeHUD();
  }
  function openHomeTilePanel(q, r) {
    const t = homeTile(home, q, r);
    if (!t || t.type === 'dirt') return;
    if (t.type === 'queen') { toast('蚁后室：占据 7 格，无需升级', 1600); return; }
    if (t.type === 'tunnel') { toast('通道'); return; }
    const def = BUILD[t.type];
    const gen = colonyPoints(home);
    const spent = home.pointsSpent || 0;
    const pool = gen - spent;
    const maxed = t.level >= 3;
    const need = maxed ? 0 : upgradeReq(t.level + 1);
    const cost = def.cost;
    const canUp = !maxed && home.food >= cost && pool >= need;
    let effect = '';
    if (t.type === 'storage') effect = '储存上限 ' + storageCapOf(t.level) + (maxed ? '' : ' → ' + storageCapOf(t.level + 1));
    else if (t.type === 'speed') effect = '移速 +' + Math.round(speedBonusOf(t.level) * 100) + '%' + (maxed ? '' : ' → +' + Math.round(speedBonusOf(t.level + 1) * 100) + '%');
    else effect = '产出等级 ' + t.level;
    const refund = Math.round(def.cost * 0.7);
    showOverlay(`
      <h2>${def.name} Lv.${t.level}</h2>
      <div class="sub">${effect}<br/>可用升级点数 ${pool}（累计 ${gen}，已消耗 ${spent}）<br/>本次升级需 ${maxed ? '—' : need} 点 + ${cost} 食物</div>
      ${maxed ? '<div class="sub">已满级</div>' : `<button class="big-btn" id="ov-up" ${canUp ? '' : 'disabled'} style="${canUp ? '' : 'opacity:.45'}">升级 · 消耗 ${need} 点 + ${cost} 食物</button>`}
      <button class="ghost-btn" id="ov-dem">拆除 · 返还 ${refund} 食物（落到地表）</button>
      <button class="ghost-btn" id="ov-close">关闭</button>
    `);
    if (!maxed) {
      const b = document.getElementById('ov-up');
      b.onclick = () => {
        if (!canUp) return;
        home.food -= cost; home.pointsSpent = spent + need; t.level++;
        persist(); Sfx.build(); refreshHomeHUD(); hideOverlay(); refreshBottom();
        toast('升级成功（消耗 ' + need + ' 点）', 1100);
      };

    document.getElementById('ov-dem').onclick = () => {
      delete home.tiles[hkey(q, r)];

      toast('拆除 ' + def.name + '，返还 ' + refund + ' 食物到地表', 1500);
    };
    document.getElementById('ov-close').onclick = hideOverlay;
  }

  // 进化
