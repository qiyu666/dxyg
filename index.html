<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<link rel="stylesheet" href="style.css?v=55" />
<title>The Ants · 小小蚁国</title>
</head>
<body>
<div id="app">
  <header id="hud" class="hidden">
    <button id="btn-back" aria-label="返回">←</button>
    <div class="stat"><span class="ico">🌿</span><b id="hud-food">0</b><i id="hud-cap"></i></div>
    <div class="stat" id="hud-w"><span class="ico">🐜</span><b id="hud-worker">0</b><i id="hud-wcap"></i></div>
    <div class="stat" id="hud-s"><span class="ico">⚔️</span><b id="hud-soldier">0</b><i id="hud-scap"></i></div>
    <div class="stat" id="hud-b"><span class="ico">🧱</span><b id="hud-blocks">0</b></div>
    <div class="stat" id="hud-j"><span class="ico">🧪</span><b id="hud-jelly">0</b></div>
    <div class="stat" id="hud-l"><span class="ico">🥚</span><b id="hud-larva">0</b></div>
    <div class="stat" id="hud-extra"></div>
  </header>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="toast" class="toast"></div>
    <div id="overlay" class="overlay hidden"><div class="overlay-card" id="overlay-card"></div></div>
    <div id="zoomctl" class="hidden">
      <button id="z-phel" aria-label="删除信息素" style="display:none">✕</button>
      <button id="z-in" aria-label="放大">＋</button>
      <button id="z-out" aria-label="缩小">－</button>
      <button id="z-reset" aria-label="复位">↺</button>
    </div>
    <button id="mapedit-entry" aria-label="地图编辑器" title="地图编辑器" onclick="location.href='map_editor.html'" style="position:fixed;top:6px;right:6px;z-index:50;width:32px;height:32px;border-radius:50%;background:rgba(20,26,33,.82);border:1px solid #2a333d;color:#e4b65c;font-size:16px;line-height:1;">🗺</button>
  </main>

  <nav id="bottom" class="hidden">
    <div id="bottom-content"></div>
  </nav>
</div>
<script src="maps/level-1-1.js?v=55"></script>
<script src="maps/level-1-2.js?v=55"></script>
<script src="maps/level-2-1.js?v=55"></script>
<script src="maps/level-2-2.js?v=55"></script>
<script src="game.js?v=55"></script>
</body>
</html>
